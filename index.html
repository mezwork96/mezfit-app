}
function buildProgram(setup){
  const nd=setup.days, split=nd<=3?'fb':nd===4?'ul':'ppl';
  let tpl=SPLITS[split]; let days=[];
  if(split==='fb') days=tpl.slice(0,nd);
  else if(split==='ul') days=tpl;
  else days=nd===5?[tpl[0],tpl[1],tpl[2],SPLITS.ul[0],SPLITS.ul[1]]:[tpl[0],tpl[1],tpl[2],tpl[0],tpl[1],tpl[2]];
  const maxEx={30:4,45:5,60:6,75:7,90:8}[setup.dur]||6; const goal=(S.main.profile&&S.main.profile.goal)||'mantenere';
  const rot={}; const rec=recList(); const age=+(S.main.profile&&S.main.profile.age)||0;
  const prog=days.map((d,di)=>{
    const used=new Set(); const ex=[]; const miss=[]; // miss: gruppi muscolari senza alcun esercizio sicuro e disponibile
    rec.filter(id=>EX[id].ty!=='c').slice((di*2)%Math.max(1,rec.length),(di*2)%Math.max(1,rec.length)+2).concat(rec.length&&di===0?[]:[]).forEach(id=>{if(!used.has(id)){used.add(id);ex.push(defaultEntry(EX[id]));}});
    if(age>=65){const bal=EX['equilibrio_su_una_gamba'];if(bal&&!exRisk(bal).length&&!used.has(bal.id)){used.add(bal.id);ex.push(defaultEntry(bal));}}
    const nStr=maxEx-(ex.length>0?1:0);
    let added=0;
    for(const slot of d.s){ if(added>=nStr)break; const [m,k]=slot.split(':'); const pool=exPool(m,k,setup).filter(e=>!used.has(e.id)); if(!pool.length){if(!miss.includes(m)&&!ex.some(en=>exf(en.id).m===m))miss.push(m);continue;}
      const top=pool.slice(0,Math.max(3,pool.filter(e=>e.pop).length));
      const key=m+k; rot[key]=(rot[key]||0); const e=top[rot[key]%top.length]; rot[key]++; used.add(e.id);
      const sc=scheme(goal,setup.level,e.k); if(e.ty==='t')sc.reps='30–60 s'; ex.push(Object.assign({id:e.id},sc)); added++;}
    if(goal==='dimagrire'){const ce=['tapis_roulant_camminata_in_s','cyclette','ellittica_cross_trainer','vogatore','camminata_veloce_all_aperto','allenamento_a_circuito_a_cor'].map(id=>EX[id]).find(x=>x&&eqAllowed(x,setup)&&!exRisk(x).length);if(ce)ex.push({id:ce.id,min:setup.dur>=60?20:15});}
    return {name:d.n,ex,wd:WDAYS[nd][di],miss};
  });
  // 7 giorni: il settimo è solo mobilità e stretching (recupero attivo)
  if(nd===7){const mob=['gatto_mucca','allungamento_flessori_dell_a','allungamento_glutei_figura_4','allungamento_pettorali_alla_','allungamento_dorsali','allungamento_polpacci_al_mur','posizione_del_bambino'].map(id=>EX[id]).filter(e=>e&&!exRisk(e).length&&!disliked().includes(e.id)).slice(0,6).map(defaultEntry);if(mob.length)prog.push({name:'Mobilità e stretching',ex:mob,wd:6});}
  return {created:today(),goal,setup:Object.assign({},setup),conds:conds().slice(),days:prog};
}

  const de=diffOf(e);

    if(reason==='difficile'){s+=diffOf(x)<de-0.2?diffOf(x)*0.6:6;}
    if(reason==='male'){s+=['macchina','cavi','elastici'].includes(x.eq)?-1.2:0;s+=x.eq!==e.eq?-0.6:0.8;s+=HARDRX.test(x.n)?1.5:0;}

  const c=altCtx, e=exf(c.e); const cands=altCandidates(e,c.reason); const list=c.showAll?cands:cands.slice(0,6);
  $('#modal').innerHTML=`<div class="row" style="margin-bottom:6px"><h2 style="margin:0">Cambia esercizio</h2><span class="sp"></span><button class="x" id="mClose">✕</button></div>

   <div class="chips" style="margin-bottom:10px">${REASONS.map(([k,n])=>`<button class="chip ${c.reason===k?'on':''}" data-ar="${k}">${n}</button>`).join('')}</div>
   ${c.reason==='male'?`<div class="note warn" style="margin-bottom:10px">Se il fastidio è un dolore vero (non fatica muscolare), fermati. Ti propongo varianti con meno stress articolare; puoi anche indicare il problema in «🩺 Problemi fisici».</div>`:''}
   ${c.ai?(c.ai.busy?`<div class="note">✨ Claude sta scegliendo le alternative…</div>`:c.ai.err?`<div class="note warn">${esc(c.ai.err)}</div>`:`<div class="small" style="font-weight:700;margin:4px 0">✨ Consigliati da Claude</div><div class="sugg" style="margin-bottom:10px">${c.ai.items.map(it=>`<div data-alt="${it.id}" style="flex-direction:column;align-items:flex-start;gap:2px"><b>${esc(exf(it.id).n)}</b><span class="muted small">${esc(it.why)}</span></div>`).join('')}</div>`):''}
   <div class="sugg">${list.length?list.map(x=>{const lp=lastPerf(x.id);return `<div data-alt="${esc(x.id)}" style="flex-direction:column;align-items:flex-start;gap:2px"><b>${esc(x.n)}</b><span class="muted small">${esc(altTag(x,e))}${lp?' · già fatto':''}</span></div>`;}).join(''):'<div>Nessuna alternativa con i filtri attuali.</div>'}</div>
   ${!c.showAll&&cands.length>6?`<button class="btn ghost sm" id="altAll" style="padding-left:0">Mostra tutte le ${cands.length} alternative</button>`:''}
   ${smp?`<div class="row" style="gap:8px;margin-top:12px"><input type="text" id="altTxt" placeholder="Spiega a Claude cosa non va (facoltativo)"><button class="btn sec sm" id="altAi">✨ Chiedi</button></div>`:''}
   <label class="cb" style="margin-top:12px;font-size:13px"><input type="checkbox" id="altBan">Non propormi più «${esc(e.n)}»</label>`;
  $('#mClose').onclick=hideModal;
  document.querySelectorAll('[data-ar]').forEach(b=>b.onclick=()=>{c.reason=b.dataset.ar;c.showAll=false;drawAlt();});
  if($('#altAll'))$('#altAll').onclick=()=>{c.showAll=true;drawAlt();};
  document.querySelectorAll('[data-alt]').forEach(el=>el.onclick=()=>applyAlt(el.dataset.alt,$('#altBan')&&$('#altBan').checked));
  if($('#altAi'))$('#altAi').onclick=async()=>{
    const why=$('#altTxt').value.trim(); const pool=altCandidates(e,c.reason).slice(0,30); if(!pool.length)return;
    c.ai={busy:true}; drawAlt();
    try{
      const out=await smp.json(`Un utente vuole sostituire l'esercizio "${e.n}" (${MUSCLE_N[e.m]}, ${EQ_N[e.eq]||e.eq}). Motivo scelto: ${REASONS.find(r=>r[0]===c.reason)[1]}.${why?` Spiegazione dell'utente: "${why}".`:''}${conds().length?` Problemi fisici: ${conds().map(k=>COND[k].n).join(', ')}.`:''} Livello: ${(S.main.training&&S.main.training.setup&&S.main.training.setup.level)||'non indicato'}.
Scegli le 3 alternative migliori SOLO da questo elenco (id|nome|attrezzo):
${pool.map(x=>`${x.id}|${x.n}|${EQ_N[x.eq]||x.eq}`).join('\n')}
Rispondi SOLO con JSON: {"items":[{"id":"...","why":"motivo in max 15 parole, in ${LNAME[LANG]}"}]}`,{modelTier:'quick',cache:false});
      const items=(out&&Array.isArray(out.items)?out.items:[]).filter(it=>it&&EX[it.id]&&pool.some(p=>p.id===it.id)).slice(0,3).map(it=>({id:it.id,why:String(it.why||'').slice(0,140)}));
      c.ai=items.length?{items}:{err:'Nessun suggerimento: scegli dall\'elenco.'};
    }catch(err){c.ai={err:'Claude non è disponibile ora: scegli dall\'elenco.'};}
    if(altCtx===c)drawAlt();

// nuova voce di scheda per l'esercizio x, conservando serie/ripetizioni/recupero della voce sostituita
function safeEntry(en,x,old){const ne=defaultEntry(x);if(x.ty!=='c'&&en.sets){ne.sets=en.sets;if(x.ty===old.ty||(x.ty!=='t'&&old.ty!=='t'))ne.reps=en.reps;ne.rest=en.rest;}return ne;}
// Sostituisce un esercizio sconsigliato della scheda con l'alternativa sicura migliore dello stesso gruppo (niente doppioni nel giorno). Ritorna «vecchio → nuovo» o null.
function fixRisky(di,ei){
  const d=S.main.training.days[di], en=d.ex[ei], old=exf(en.id);
  const x=altCandidates(old,'male').find(c=>!d.ex.some(o=>o.id===c.id)); if(!x)return null;
  d.ex[ei]=safeEntry(en,x,old); return `${old.n} → ${x.n}`;
}
function applyAlt(newId,ban){
  const c=altCtx, x=exf(newId), old=exf(c.e);
  if(ban){S.main.dislikedEx=[...new Set(disliked().concat([old.id]))];}
  if(c.where==='plan'){const d=S.main.training.days[c.a];d.ex[c.b]=safeEntry(d.ex[c.b],x,old);}
  else{const se=session.ex[c.a];const en=defaultEntry(x);if(se.target&&se.target.sets&&x.ty!=='c'){en.sets=se.target.sets;if(x.ty!=='t'&&old.ty!=='t')en.reps=se.reps;}const sg=suggest(en);
    session.ex[c.a]=x.ty==='c'?{id:x.id,ty:'c',min:en.min,km:'',target:{min:en.min},done:false}:{id:x.id,ty:x.ty,rest:en.rest,reps:en.reps,target:{sets:en.sets,reps:en.reps,kg:sg.kg||''},sets:Array.from({length:en.sets},()=>({kg:sg.kg||'',reps:sg.reps||rng2(en.reps)[0],ok:false}))};
    S.main.activeSession=session;}
  save('main'); hideModal(); toast(`${old.n} → ${x.n}`+(ban?' (non te lo proporrò più)':'')); const y=window.scrollY; render(); window.scrollTo(0,y);
}

function endSession(){
  const pr=S.main.profile, mins=Math.max(1,Math.round((Date.now()-session.start)/60000));
  let cardioMin=0,cardioK=0,ex=[];
  session.ex.forEach(e=>{const x=exf(e.id);
    if(e.ty==='c'){if(!e.done)return;const m=parseFloat(e.min)||0;cardioMin+=m;cardioK+=(x.met||6)*pr.weight*m/60;ex.push({id:e.id,min:m,km:parseFloat(e.km)||0,target:e.target,sets:[]});return;}
    ex.push({id:e.id,target:e.target,sets:e.sets.map(s=>({kg:parseFloat(s.kg)||0,reps:parseInt(s.reps)||0,ok:!!s.ok}))});});
  const light=session.ex.every(e=>['yoga','stretching','mobilita','riab','pilates'].includes(exf(e.id).m));
  const kcal=Math.round(cardioK+(light?2.5:5)*pr.weight*Math.max(0,mins-cardioMin)/60);
  const vol=ex.reduce((s,e)=>s+e.sets.filter(x=>x.ok).reduce((a,x)=>a+x.kg*x.reps,0),0);
  const sDone=ex.reduce((s,e)=>s+e.sets.filter(x=>x.ok).length,0), sPlan=ex.reduce((s,e)=>s+(e.target&&e.target.sets||0),0);

  const d=today(); setDayWorkouts(d,dayWorkouts(d).concat([w]));
  restStop(); session=null; S.main.activeSession=null; save('main');

function trainProgress(){

}

  $('#mClose').onclick=()=>{hideModal();if(pickDay!=='sess'){pickDay=null;render();}};
  const qi=$('#pkQ'); qi.oninput=e=>{libPickQ=e.target.value;drawPicker();const n=$('#pkQ');n.focus();n.setSelectionRange(n.value.length,n.value.length);};

}

let THUMB_IO=null;
function lazyThumbs(){

// ---- timer di recupero: barra fissa sopra la navigazione. Il tempo restante si calcola dall'orario di fine (session.restEnd),
// così resta giusto anche se il telefono si blocca o l'app viene ricaricata. ----
function startRest(sec){
  if(!session||!(sec>0))return;
  session.restEnd=Date.now()+sec*1000; S.main.activeSession=session; save('main');
  restShow();
}
function restShow(){
  const bar=$('#restBar'), nav=document.querySelector('nav.tabs'); if(!bar)return;
  bar.style.bottom=(nav?nav.offsetHeight:60)+'px'; // sopra la barra di navigazione, safe-area compresa
  bar.classList.remove('hidden','done'); document.body.classList.add('resting');
  bar.innerHTML=`<div class="in"><div class="rt"><span class="tm">0:00</span><small>Recupero</small></div><button type="button" id="restPlus" aria-label="Aggiungi 30 secondi">+30 s</button><button type="button" id="restSkip">Salta</button></div>`;
  $('#restPlus').onclick=()=>{if(!session||!session.restEnd)return;session.restEnd=Math.max(Date.now(),session.restEnd)+30000;S.main.activeSession=session;save('main');restTick();};
  $('#restSkip').onclick=restStop;
  clearInterval(restT); restTick(); restT=setInterval(restTick,500);
}
function restTick(){
  const bar=$('#restBar'); if(!bar||bar.classList.contains('hidden'))return;
  if(!session||!session.restEnd){restStop();return;}
  const left=Math.ceil((session.restEnd-Date.now())/1000);
  if(left>0){const tm=bar.querySelector('.tm');if(tm)tm.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;return;}
  // finito: avviso, vibrazione se disponibile, la barra sparisce da sola dopo qualche secondo
  clearInterval(restT); restT=null; session.restEnd=null; S.main.activeSession=session; save('main');
  bar.classList.add('done'); const rt=bar.querySelector('.rt'); if(rt)rt.innerHTML=`<span>⏱️ Recupero finito: prossima serie!</span>`;
  const sk=$('#restSkip'); if(sk)sk.textContent='OK'; const pl=$('#restPlus'); if(pl)pl.remove();
  try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}
  setTimeout(()=>{if(session&&session.restEnd)return;const b=$('#restBar');if(b&&b.classList.contains('done'))restStop();},4000);
}
function restStop(){
  if(session&&session.restEnd){session.restEnd=null;S.main.activeSession=session;save('main');}
  clearInterval(restT); restT=null;
  const bar=$('#restBar'); if(bar){bar.classList.add('hidden');bar.classList.remove('done');bar.innerHTML='';} document.body.classList.remove('resting');
}

/* ===================== CARBOIDRATI CICLICI ===================== */
function wdOf(d){return (parseYmd(d).getDay()+6)%7;}
function trainWeekdays(){const t=S.main.training;if(!t||!t.days)return [];return [...new Set(t.days.map(x=>x.wd).filter(x=>x!=null))];}
function isTrainDay(d){return trainWeekdays().includes(wdOf(d))||dayWorkouts(d).some(w=>w.type==='forza');}
function adv(){return S.main.adv!==false;}
function cycleOn(){const n=trainWeekdays().length;return adv()&&!!S.main.carbCycle&&n>0&&n<7;}
function targetsFor(train){
  const c=calc(S.main.profile); if(!c) return null; const T={k:c.target,P:c.P,C:c.C,F:c.F,train,delta:0,capped:false,floor:0};
  if(!cycleOn()) return T;
  // i giorni di allenamento partono da +10%; il riposo compensa, ma non scende mai sotto il minimo di sicurezza
  // (1200 kcal donna / 1500 uomo) né oltre -15% dell'obiettivo; se serve, la differenza tra i giorni si riduce
  const n=trainWeekdays().length, k=c.target;
  const restMin=Math.min(k,Math.max(c.floor,0.85*k));
  let restK=k-0.10*k*n/(7-n);
  if(restK<restMin){restK=restMin;T.capped=true;T.floor=Math.round(restMin);}
  const restD=restK-k, trainD=-restD*(7-n)/n; // settimana a somma zero
  const dk=train?trainD:restD;
  T.delta=dk; T.k=k+dk;
  // macro coerenti con le kcal del giorno: cambiano solo i carboidrati; se scendono troppo, cedono un po' i grassi
  let C=(T.k-T.P*4-T.F*9)/4;
  if(C<50){C=Math.min(50,Math.max(0,(T.k-T.P*4)/4));T.F=Math.max(0,(T.k-T.P*4-C*4)/9);}
  T.C=C; return T;
}
function dayTargets(d){return targetsFor(isTrainDay(d));}

/* ===================== SCARICO ===================== */
function weekHasTraining(ws){let n=0;for(let i=0;i<7;i++)n+=dayWorkouts(addDays(ws,i)).filter(w=>w.type==='forza').length;return n>=2;}
function streakWeeks(){let ws=addDays(weekStart(today()),-7),n=0;const stop=S.main.lastDeload||'0000';while(ws>stop&&weekHasTraining(ws)&&n<20){n++;ws=addDays(ws,-7);}return n;}
function deloadActive(){return S.main.deloadWeek===weekStart(today());}
function deloadDue(){const st=S.main.training&&S.main.training.setup;if(st&&st.level==='principiante'&&S.main.training.created>addDays(today(),-56))return false;return !!S.main.training&&!deloadActive()&&S.main.deloadSnooze!==weekStart(today())&&streakWeeks()>=5;}
function deloadBanner(){
  if(!adv())return '';
  if(deloadActive()) return `<div class="note" style="margin-bottom:12px">🧘 <b>Settimana di scarico attiva</b>: stessi esercizi, circa il 40% di serie in meno e il 10% di peso in meno. Il corpo recupera e la settimana prossima riparti più forte. Se hai dolori, approfittane per fare stretching e mobilità. <button class="btn ghost sm" id="dlOff">Annulla scarico</button></div>`;
  if(deloadDue()) return `<div class="note warn" style="margin-bottom:12px">💡 Ti alleni da <b>${streakWeeks()} settimane di fila</b>: è il momento di una settimana di scarico per recuperare ed evitare stalli e infortuni.<div class="row" style="gap:6px;margin-top:8px"><button class="btn sm" id="dlOn">Attiva questa settimana</button><button class="btn ghost sm" id="dlLater">Più avanti</button></div></div>`;
  return '';
}

/* ===================== RISCALDAMENTO ===================== */
function buildWarmup(dayEx){
  const ms=new Set(dayEx.map(en=>exf(en.id).m)); const lower=['gambe','femorali','glutei','polpacci','adduttori'].some(m=>ms.has(m)), upper=['petto','schiena','spalle','bicipiti','tricipiti'].some(m=>ms.has(m));
  const pick=names=>names.map(n=>EXDB.find(e=>e.n===n)).find(e=>e&&eqAllowed(e)&&!exRisk(e).length);
  const items=[];
  const card=pick(['Cyclette','Ellittica (cross trainer)','Vogatore','Tapis roulant camminata'])||null;
  const age=+(S.main.profile&&S.main.profile.age)||0, mins=conds().some(c=>['cuore','sovrappeso'].includes(c))||age>=65?'8–10':'5';
  items.push(card?`${mins}′ di ${card.n.toLowerCase()} leggera, aumentando piano`:`${mins}′ di marcia sul posto con le braccia attive`);
  if(lower){[pick(['World\'s greatest stretch','Circonduzioni delle anche']),pick(['Circonduzioni delle anche','Squat a corpo libero'])].forEach(e=>e&&!items.includes(e.n)&&items.push(e.n+' · 8 per lato'));}
  if(upper){[pick(['Circonduzioni delle braccia']),pick(['Rotazioni esterne con elastico','Scapular push-up','Wall angels'])].forEach(e=>e&&items.push(e.n+' · 10 ripetizioni'));}
  if(!upper&&conds().some(c=>['spalla','instabilita','capsulite','cuffia','impingement'].includes(c))){const e=pick(['Rotazioni esterne con elastico']);if(e)items.push(e.n+' · 10 ripetizioni');}
  if(conds().some(c=>['lombare','sciatica','stenosi','dorsale'].includes(c))){const e=pick(['Gatto-mucca','Bird dog']);if(e)items.push(e.n+' · 8 lente');}
  let ramp=null; const first=dayEx.find(en=>exf(en.id).ty==='w'); if(first){const sg=suggest(first);const kg=parseFloat(sg.kg)||0;if(kg>=10){const r=x=>Math.max(0,Math.round(kg*x/2.5)*2.5);ramp={n:exf(first.id).n,sets:exf(first.id).k==='c'&&kg>=30?[[r(.5),8],[r(.7),5],[r(.85),2]]:[[r(.5),10],[r(.75),5]]};}}
  return {items,ramp,done:[]};
}

/* ===================== MISURE E FOTO ===================== */
const MEAS=[['vita','Vita'],['fianchi','Fianchi'],['petto','Petto'],['braccio','Braccio'],['coscia','Coscia'],['collo','Collo']];
function measures(){return (S.main.measures||[]).slice().sort((a,b)=>a.d.localeCompare(b.d));}
function measureDue(){const m=measures();const last=m.length?m[m.length-1].d:null;const ph=Object.values(S.photos||{}).map(p=>p.d).sort().pop();const l=[last,ph].filter(Boolean).sort().pop();return !l||l<=addDays(today(),-14);}
let phSel=[];
function measureCard(){
  if(!adv())return '';
  const m=measures(), first=m[0], last=m[m.length-1]; const ph=Object.entries(S.photos||{}).sort((a,b)=>b[1].d.localeCompare(a[1].d));
  return `<div class="card" id="misure">
   <h3>📏 Misure e foto</h3>
   <p class="small muted" style="margin-top:0">Ogni 2 settimane, al mattino, stesse condizioni. Spesso le misure cambiano anche quando la bilancia è ferma.</p>
   <div class="grid3">${MEAS.map(([k,n])=>`<label class="f">${n} (cm)<input type="number" step="0.5" inputmode="decimal" data-ms="${k}" value="${last&&last.d===today()&&last[k]?last[k]:''}" placeholder="${last&&last[k]?fmtN(last[k]):''}"></label>`).join('')}</div>
   <button class="btn sm" id="msSave" style="margin-top:10px">Salva misure di oggi</button>
   ${m.length?`<table class="t" style="margin-top:12px"><tr><th>Data</th>${MEAS.map(([k,n])=>`<th>${n}</th>`).join('')}</tr>${m.slice(-6).reverse().map(x=>`<tr><td>${parseYmd(x.d).toLocaleDateString(LOCALE[LANG],{day:'numeric',month:'numeric'})}</td>${MEAS.map(([k])=>`<td>${x[k]?fmtN(x[k]):'—'}</td>`).join('')}</tr>`).join('')}${m.length>1?`<tr><td><b>Δ</b></td>${MEAS.map(([k])=>{const a=m.find(x=>x[k]),b=[...m].reverse().find(x=>x[k]);if(!a||!b||a===b)return '<td>—</td>';const dd=b[k]-a[k];return `<td style="color:${dd<0?'var(--accent)':dd>0?'var(--warn)':'inherit'}"><b>${dd>0?'+':''}${fmtN(r1(dd))}</b></td>`;}).join('')}</tr>`:''}</table>`:''}
   <div class="row" style="margin-top:14px"><b class="small">📷 Foto dei progressi</b><span class="sp"></span><label class="btn sec sm" style="cursor:pointer">+ Aggiungi foto<input type="file" id="phIn" accept="image/*" capture="environment" style="display:none"></label></div>
   <p class="small muted" style="margin:4px 0 8px">Restano private su questo dispositivo${cloud?' e nel tuo account':''}; non entrano nel backup. Tocca due foto per confrontarle.</p>
   ${phSel.length===2&&S.photos[phSel[0]]&&S.photos[phSel[1]]?`<div class="grid2" style="margin-bottom:10px">${phSel.map(id=>`<div><img src="${safeImg(S.photos[id].img)}" alt="" style="width:100%;border-radius:10px"><div class="small muted" style="text-align:center">${esc(dayLabel(S.photos[id].d))}</div></div>`).join('')}</div>`:''}
   <div class="grid4">${ph.map(([id,p])=>`<div style="position:relative"><img src="${safeImg(p.img)}" alt="" data-ph="${esc(id)}" style="width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;cursor:pointer;outline:${phSel.includes(id)?'3px solid var(--accent)':'none'}"><div class="small muted" style="text-align:center">${parseYmd(p.d).getDate()}/${parseYmd(p.d).getMonth()+1}</div><button class="x" data-phdel="${esc(id)}" style="position:absolute;top:2px;right:2px;background:var(--surface)">✕</button></div>`).join('')}</div>
  </div>`;
}
function shrinkImage(file,max){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const sc=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.72));};im.onerror=rej;im.src=url;});}
function bindMeasure(rr){
  if(!$('#msSave'))return;
  $('#msSave').onclick=()=>{const rec={d:today()};let any=false;document.querySelectorAll('[data-ms]').forEach(i=>{const v=parseFloat(String(i.value).replace(',','.'));if(v>0){rec[i.dataset.ms]=r1(v);any=true;}});if(!any){toast('Inserisci almeno una misura');return;}S.main.measures=(S.main.measures||[]).filter(x=>x.d!==today()).concat([rec]);save('main');toast('Misure salvate');rr();};
  $('#phIn').onchange=async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;let img=null;try{img=await shrinkImage(f,560);}catch(err){toast('Impossibile leggere la foto');return;}
    const ok=await addPhoto(img);toast(ok?'Foto salvata':'Memoria piena: la foto non è stata salvata');rr();};
  document.querySelectorAll('[data-ph]').forEach(im=>im.onclick=()=>{const id=im.dataset.ph;phSel=phSel.includes(id)?phSel.filter(x=>x!==id):phSel.concat([id]).slice(-2);rr();});
  document.querySelectorAll('[data-phdel]').forEach(b=>b.onclick=()=>{if(!b.dataset.sure){b.dataset.sure=1;b.textContent='?';return;}const id=b.dataset.phdel;deletePhoto(id);phSel=phSel.filter(x=>x!==id);rr();});
}

/* ===================== OGGI ===================== */
function planToday(){const p=S.main.plan;if(!p||!p.days.length)return null;const di=p.range==='week'?wdOf(today()):0;return {p,di,day:p.days[Math.min(di,p.days.length-1)]};}
function trainToday(){const t=S.main.training;if(!t||!t.days.length)return null;const wi=wdOf(today());const di=t.days.findIndex(d=>d.wd===wi);return di<0?null:{t,di,day:t.days[di]};}
function viewToday(){
  const c=calc(S.main.profile); if(!c) return needProfile();
  const d=today(), T=dayTargets(d), ents=dayEntries(d), tot=sumEntries(ents), burn=dayBurn(d), tg=T.k+(S.main.addBurn?burn:0), rem=tg-tot.k;
  const dt=parseYmd(d); const pt=planToday(), tt=trainToday();
  const ws=weights(); const lastW=ws[ws.length-1]; const needW=!lastW||lastW.d<=addDays(d,-3);
  const doneW=dayWorkouts(d).filter(w=>w.type==='forza');
  return `
  <div style="margin-bottom:12px"><div style="font-size:22px;font-weight:800;letter-spacing:-.02em">${DOW[wdOf(d)]} ${dt.getDate()} ${MONTHS[dt.getMonth()]}</div>
   <div class="small muted">${T.train?'🏋️ Giorno di allenamento':'😴 Giorno di riposo'}${cycleOn()?` · carboidrati ${T.delta>0?'+':''}${Math.round(T.delta/4)} g`:''}${deloadActive()?' · settimana di scarico':''}</div></div>
  ${deloadBanner()}
  ${adv()&&measureDue()?`<div class="note" style="margin-bottom:12px">📏 ${(S.main.measures||[]).length||Object.keys(S.photos||{}).length?'Sono passate 2 settimane: è il momento di <b>misure e foto</b>.':'Registra <b>misure e foto di partenza</b>: tra qualche settimana vedrai la differenza.'} <button class="btn ghost sm" id="goMeas">Vai</button></div>`:''}
  <div class="card">
   <div class="hero">${ring(tot.k,tg)}<div style="flex:1"><div class="small muted" style="font-weight:600">${rem>=0?'Restano':'Oltre di'}</div><div style="font-size:24px;font-weight:800;color:${rem>=0?'var(--ink)':'var(--warn)'}">${fmt(Math.abs(rem))} kcal</div>${burn?`<div class="small">🔥 ${fmt(burn)} kcal di attività</div>`:''}<button class="btn ghost sm" id="goDiary" style="padding-left:0">Apri il diario ›</button></div></div>
   ${macroBar('Proteine',tot.p,T.P,'var(--p)')}${macroBar('Carboidrati',tot.c,T.C,'var(--c)')}${macroBar('Grassi',tot.f,T.F,'var(--f)')}
  </div>
  <div class="card"><div class="row" style="margin-bottom:6px"><h3 style="margin:0">🍽️ Pasti di oggi</h3><span class="sp"></span>${pt?'<span class="small muted">dal tuo piano</span>':''}</div>
   ${pt?pt.day.meals.map((m,mi)=>{const t=mealTotals(m.items);const chk=mealCheck(m.items,pt.p.style);return `<div class="ent" style="flex-wrap:wrap"><div class="n" style="min-width:130px"><b style="font-weight:600">${esc(m.name)}</b><small>${esc(recipe(m).title)} · ${fmt(t.k)} kcal</small></div><div class="pactions" style="margin:0">${diaryButtons(pt.di,mi,true)}</div>${chk.any?`<div style="flex-basis:100%">${mealIssueHtml(chk)}</div>`:''}</div>`;}).join(''):`<p class="small muted">Nessun piano alimentare. <button class="btn ghost sm" id="goPlan">Crealo ora</button></p>`}
  </div>
  <div class="card"><h3 style="margin:0 0 6px">🏋️ Allenamento di oggi</h3>
   ${session?`<p class="small" style="margin:0 0 8px">In corso: <b>${esc(session.dayName)}</b></p><button class="btn sm" id="goSess">▶ Riprendi</button>`
    :doneW.length?`<p class="small" style="margin:0 0 8px">✓ Fatto: <b>${esc(doneW[0].name)}</b> · ${doneW[0].min}′ · ≈ ${fmt(doneW[0].kcal)} kcal</p><button class="btn sec sm" id="goStretch">🧘 Stretching dopo l'allenamento</button>`
    :tt?`<p class="small" style="margin:0 0 8px"><b>${esc(tt.day.name)}</b> · ${tt.day.ex.length} esercizi${deloadActive()?' · scarico':''}</p><button class="btn sm" data-tstart2="${tt.di}">▶ Inizia</button>`
    :S.main.training?`<p class="small muted" style="margin:0 0 8px">Oggi riposo: 20–30′ di camminata o un po' di mobilità aiutano il recupero.</p><button class="btn ghost sm" data-tstart2="${nextDayIdx()}" style="padding-left:0">Allenati comunque (${esc(S.main.training.days[nextDayIdx()].name)})</button>`
    :`<p class="small muted" style="margin:0">Nessuna scheda. <button class="btn ghost sm" id="goTrain">Creala ora</button></p>`}
  </div>
  ${needW?`<div class="card"><div class="row" style="gap:8px"><b style="flex:1">⚖️ Peso di oggi</b><input type="number" step="0.1" inputmode="decimal" id="tdW" aria-label="Peso di oggi (kg)" placeholder="kg" style="width:100px"><button class="btn sm" id="tdWs">Salva</button></div><div class="small muted" style="margin-top:4px">${lastW?`Ultima pesata ${esc(dayLabel(lastW.d).toLowerCase())}: ${esc(fmtN(lastW.kg))} kg`:'Pesati 2–3 volte a settimana al mattino.'}</div></div>`:''}
  ${waterCard(d)}`;
}
function bindToday(){
  const rr=()=>{const y=window.scrollY;render();window.scrollTo(0,y);};
  const go=(t)=>{tab=t;try{history.replaceState(null,'','#'+t);}catch(e){}render();window.scrollTo(0,0);};
  bindDeload(rr); bindWater(today(),rr);
  if($('#goDiary'))$('#goDiary').onclick=()=>{ui.date=today();go('diario');};
  if($('#goPlan'))$('#goPlan').onclick=()=>{ui.planView='piano';go('dieta');};
  if($('#goTrain'))$('#goTrain').onclick=()=>{tv='programma';go('allenamento');};
  if($('#goStretch'))$('#goStretch').onclick=()=>{tv='stretch';sui.goal='scheda';S.main.stretchRoutine=buildStretch(Object.assign({},sui,{goal:'scheda',min:10}));save('main');go('allenamento');};
  if($('#goSess'))$('#goSess').onclick=()=>{tv='allenati';go('allenamento');};
  if($('#goMeas'))$('#goMeas').onclick=()=>{go('andamento');setTimeout(()=>{const m=$('#misure');if(m)m.scrollIntoView({behavior:'smooth'});},50);};
  document.querySelectorAll('[data-tstart2]').forEach(b=>b.onclick=()=>askStart(+b.dataset.tstart2));
  bindPlanDiary(rr);
  if($('#tdWs'))$('#tdWs').onclick=()=>{const v=parseFloat(String($('#tdW').value).replace(',','.'));if(!(v>25&&v<350)){toast('Inserisci un peso valido');return;}logWeight(today(),r1(v));toast('Peso salvato');rr();};
}

function bind(t){if(t==='oggi')bindToday();if(t==='profilo')bindProfile();if(t==='diario')bindDiary();if(t==='andamento')bindTrend();if(t==='dieta')bindDiet();if(t==='allenamento')bindTrain();}
init();
initVoice();
</script>
