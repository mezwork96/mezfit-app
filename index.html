<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MezFit</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f3f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1210" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MezFit">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f5f6f3; --surface:#ffffff; --surface2:#eef1ec; --ink:#16201a; --ink2:#4c5a50; --muted:#5f6d63;
  --line:#dfe4dd; --accent:#1a7a50; --accent-ink:#ffffff; --accent-soft:#dcf1e5;
  --p:#2f6fd6; --c:#96610f; --f:#a23f86; --warn:#c2621a; --warn-soft:#fbe9dc; --bad:#c23b3b;
  --radius:16px; --shadow:0 1px 2px rgba(20,30,25,.06),0 4px 16px rgba(20,30,25,.05);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0f1411; --surface:#171e1a; --surface2:#1f2823; --ink:#e8efe9; --ink2:#b3c0b7; --muted:#8a988f;
  --line:#2a352f; --accent:#3cb87f; --accent-ink:#06130c; --accent-soft:#163626;
  --p:#6b9ef0; --c:#e6a94f; --f:#d77cbd; --warn:#e88a4a; --warn-soft:#3a2516; --bad:#ec6a6a;
  --shadow:none;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
.app{max-width:760px;margin:0 auto;padding:16px 14px 96px}
header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:6px}
.sync{min-width:0}
@media (max-width:560px){#syncTxt{display:none}}
.brand{font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand span{color:var(--brand)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--accent)} .dot.busy{background:var(--c)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;max-width:760px;width:100%}
nav.tabs button{flex:1;background:none;border:0;padding:10px 1px 12px;font-size:10.5px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent)}
nav.tabs button.center{flex:1.15;position:relative}
nav.tabs button.center svg{width:28px;height:28px;padding:9px;box-sizing:content-box;border-radius:50%;background:var(--accent);color:var(--accent-ink);margin-top:-26px;box-shadow:0 4px 14px rgba(0,0,0,.18);border:4px solid var(--surface)}
nav.tabs button.center.on{color:var(--accent)}
.hdprof{border:0;background:var(--surface2);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;margin-left:8px;flex:none}
.hdprof svg{width:20px;height:20px}
.hdprof.on{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:14px}
h2{font-size:18px;margin:0 0 12px;letter-spacing:-.01em}
h3{font-size:15px;margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--ink2)}
input[type=number],input[type=text],input[type=date],select{width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface2);font-size:15px;font-weight:500;outline:none}
input:focus,select:focus{border-color:var(--accent)}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;padding:8px 8px;border-radius:9px;font-weight:600;font-size:13px;color:var(--ink2);cursor:pointer;min-width:max-content}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.sec{background:var(--surface2);color:var(--ink)}
.btn.ghost{background:none;color:var(--accent);padding:8px 10px}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.danger{background:none;color:var(--bad)}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.sp{flex:1}
.stat{background:var(--surface2);border-radius:12px;padding:10px 12px}
.stat .v{font-size:20px;font-weight:800;letter-spacing:-.02em}
.stat .l{font-size:12px;color:var(--muted);font-weight:600}
.hero{display:flex;align-items:center;gap:18px}
.hero .big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
.bar{height:8px;background:var(--surface2);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px}
.macro{margin-top:10px}
.macro .t{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:4px}
.note{font-size:13px;padding:10px 12px;border-radius:12px;background:var(--accent-soft);color:var(--ink)}
.note.warn{background:var(--warn-soft)}
input[type=range]{width:100%;accent-color:var(--accent)}
.meal{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.meal:first-child{border-top:0;margin-top:0;padding-top:0}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.mh b{font-size:14px}
.ent{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:14px}
.ent .n{flex:1;min-width:0}
.ent .n small{display:block;color:var(--muted);font-size:12px}
.ent .k{font-weight:700;white-space:nowrap}
.x{background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 6px;border-radius:8px;font-size:16px;line-height:1}
.x:hover{background:var(--surface2);color:var(--bad)}
.datenav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.datenav .d{flex:1;text-align:center;font-weight:700}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:36px;height:36px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 10px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal-bg.on{display:flex}
.modal{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media (min-width:640px){.modal-bg{align-items:center}.modal{border-radius:20px}}
.sugg{border:1px solid var(--line);border-radius:12px;max-height:220px;overflow:auto;margin-top:6px}
.sugg div{padding:9px 12px;cursor:pointer;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.sugg div:hover,.sugg div.on{background:var(--accent-soft)}
.pantry-cat{margin-bottom:12px}
.pantry-cat .hd{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:13px;margin-bottom:6px;color:var(--ink2)}
.chart-wrap{position:relative}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:7px 9px;border-radius:9px;white-space:nowrap;transform:translate(-50%,-110%);display:none;z-index:5;font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line)}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{color:var(--muted);font-weight:600}
.plan-day{margin-bottom:6px}
.pitem{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px}
.pitem .n{flex:1}
.pitem .g{font-weight:700;white-space:nowrap}
.pitem .u{color:var(--muted);font-size:12px}
.swap{background:none;border:1px solid var(--line);border-radius:10px;cursor:pointer;padding:6px 10px;min-height:44px;min-width:44px;font-size:13px;color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;gap:4px}
/* azioni sotto il nome dell'esercizio (scheda): in fila, ognuna ≥ 44 px */
.exacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;flex-basis:100%}
/* nomi di esercizio cliccabili: area di tocco 44 px senza cambiare l'impaginazione */
b[data-exinfo]{display:inline-block;min-width:44px;padding:12px 0;margin:-12px 0}
.shop-item{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.shop-item.done .n{text-decoration:line-through;color:var(--muted)}
.shop-item input{width:18px;height:18px;accent-color:var(--accent)}
.daytabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.daytabs button{flex:0 0 auto}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));bottom:auto;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;display:none;z-index:60;pointer-events:none;align-items:center;gap:12px}
.toast.show{display:flex}
.toast button{pointer-events:auto;border:0;background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);font:inherit;font-weight:800;padding:8px 12px;min-height:40px;border-radius:10px;cursor:pointer;white-space:nowrap}
#goalSeg button{flex:1 1 45%}
.voice{display:flex;gap:8px;align-items:center}
.voice input{flex:1}
.mic{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.mic.rec{background:var(--bad);animation:pulse 1.2s infinite}
.mic svg{width:20px;height:20px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(194,59,59,.5)}70%{box-shadow:0 0 0 12px rgba(194,59,59,0)}100%{box-shadow:0 0 0 0 rgba(194,59,59,0)}}
.act{display:flex;gap:8px;align-items:flex-start;padding:7px 0;font-size:14px;border-bottom:1px solid var(--line)}
.act .s{font-weight:800;width:18px;text-align:center}
.act.add .s{color:var(--accent)} .act.rem .s{color:var(--bad)} .act.upd .s{color:var(--c)}
.prow{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.prow .n{flex:1;min-width:0}
.prow.no .n{color:var(--muted);text-decoration:line-through}
.pb{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:15px;font-weight:800;color:var(--muted);flex:0 0 auto;filter:grayscale(1);opacity:.6}
.pb.on{filter:none;opacity:1}
.pb.have.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pb.buy.on{background:color-mix(in srgb,var(--p) 18%,var(--surface));border-color:var(--p);color:var(--ink)}
.pb.no{color:var(--bad)} .pb.no.on{background:var(--bad);border-color:var(--bad);color:var(--accent-ink)}
.pcat{border-bottom:1px solid var(--line)}
.pcat-h{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:0;padding:12px 2px;font-weight:700;font-size:14px;cursor:pointer;text-align:left}
#pFilt button{font-size:12px;padding:8px 6px}
.demo{display:flex;flex-direction:column;align-items:center;background:var(--surface2);border-radius:14px;padding:8px;margin-bottom:10px}
.dm-b{stroke:var(--ink);stroke-width:5;stroke-linecap:round}
.dm-far{stroke:var(--muted);stroke-width:4.5;stroke-linecap:round;opacity:.55}
.dm-head{fill:var(--surface2);stroke:var(--ink);stroke-width:4}
.dm-n{stroke:#3d4a57;stroke-linecap:round}.dm-fill{fill:#3d4a57;stroke:none}
.dm-f{stroke:#aab4bf;stroke-linecap:round}
.dm-hd{fill:#3d4a57}.dm-eye{fill:#fff;opacity:.85}.dm-jt{fill:#fff;opacity:.55}
.dm-sk{stroke:rgba(0,0,0,.28);stroke-width:.7;stroke-linejoin:round}.dm-shoe{stroke:#59626b}
.dm-mu{opacity:.62;stroke:none}line.dm-mu{opacity:.62}.dm-muf{opacity:.35}
.dm-arc{fill:none;stroke:#16a34a;stroke-width:2}.dm-deg{font:600 10px system-ui,sans-serif;fill:#15803d;text-anchor:middle;paint-order:stroke;stroke:var(--surface2);stroke-width:3px}
.dm-guide{stroke:#16a34a;stroke-width:2;stroke-dasharray:5 4;stroke-linecap:round}
.tech{text-align:left;margin:8px 0 2px}.tech h4{margin:10px 0 4px;font-size:14px}.tech ol{margin:0;padding-left:20px;font-size:13.5px}.tech ol li{margin:3px 0}.tech .err{list-style:none;padding:0;margin:0;font-size:13.5px}.tech .err li{padding:3px 0 3px 24px;position:relative}.tech .err li:before{content:'✕';position:absolute;left:5px;color:#d40000;font-weight:800}
.safe{list-style:none;padding:0;margin:8px 0 4px;font-size:13.5px}.safe li{padding:3px 0 3px 24px;position:relative}.safe li:before{content:'✓';position:absolute;left:4px;color:#16a34a;font-weight:700}
.dm-ghost{opacity:.18}
.v3{width:100%;max-width:360px;margin:0 auto}.v3wrap{cursor:grab;user-select:none;-webkit-user-select:none}.v3wrap:active{cursor:grabbing}
.v3bar{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin:4px 0 2px}.v3bar button{border:0;background:var(--surface2);color:var(--ink2);font:inherit;font-size:12.5px;font-weight:700;padding:6px 12px;min-height:44px;min-width:44px;border-radius:999px;cursor:pointer}
.v3bar button.on{background:var(--accent);color:var(--accent-ink)}.v3hint{text-align:center;font-size:11.5px}
.g3wrap{border-radius:14px;background:radial-gradient(ellipse at 50% 38%,var(--surface),var(--surface2));overflow:hidden}.g3cv{display:block;width:100%;height:auto}
.dm-flo{fill:var(--surface2);stroke:var(--line);stroke-width:.8}.dm-eq3{stroke:#6d7780;stroke-width:.8;stroke-linejoin:round}
.dmleg{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;font-size:12px;color:var(--muted);margin-top:2px}.dmleg span{white-space:nowrap}.dmleg i{display:inline-block;width:14px;height:6px;border-radius:3px;margin-right:5px;vertical-align:middle}.dmleg .lm{background:#f0281f}.dmleg .lk{background:#16a34a}.dmleg .lg{background:#3d4a57;opacity:.2}.dm-ghost .dm-hd{fill:#3d4a57}
@media (prefers-color-scheme:dark){.dm-n{stroke:#dfe6ee}.dm-fill,.dm-hd,.dm-ghost .dm-hd{fill:#dfe6ee}.dm-f{stroke:#6b7682}.dm-eye{fill:#222}.dm-jt{fill:#222}}
.dm-floor{stroke:var(--line);stroke-width:2}
.dm-eq{fill:var(--line);stroke:none}
.dm-eqs{stroke:var(--muted);stroke-width:3;stroke-linecap:round}
.dm-cab{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:3 3}
.dm-plate{fill:#7d8a97;stroke:var(--surface2);stroke-width:1.5}
.hidden{display:none!important}
details summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--ink2)}
.cb{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
body.wiz nav.tabs,body.wiz #hdProf{display:none}
.lang{position:relative;margin-left:auto;margin-right:10px}
#langBtn{border:0;background:var(--surface2);font:inherit;font-size:13px;font-weight:700;color:var(--ink);padding:6px 11px;border-radius:999px;cursor:pointer}
#langMenu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;z-index:80;min-width:170px}
#langMenu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;font:inherit;font-size:15px;color:var(--ink);padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left}
#langMenu button:hover{background:var(--surface2)}#langMenu .fl{font-size:18px}#langMenu .ck{margin-left:auto;color:var(--accent);font-weight:800;visibility:hidden}#langMenu button.on .ck{visibility:visible}#langMenu button.on{font-weight:700}
.cb input{width:18px;height:18px;accent-color:var(--accent)}

/* colori per sezione (il verde resta il colore del marchio) */
:root{--brand:#1a7a50}
body[data-sec=diario]{--accent:#12808c;--accent-soft:#d8eff1}
body[data-sec=dieta]{--accent:#56731a;--accent-soft:#e9f1d6}
body[data-sec=allenamento]{--accent:#d40000;--accent-soft:#ffdcdc}
body[data-sec=andamento]{--accent:#4a6178;--accent-soft:#e1e8ef}
body[data-sec=profilo]{--accent:#b45309;--accent-soft:#fdebd3}
@media (prefers-color-scheme:dark){
 :root{--brand:#3cb87f}
 body[data-sec=diario]{--accent:#35b3be;--accent-soft:#12343a}
 body[data-sec=dieta]{--accent:#9cc04a;--accent-soft:#283417}
 body[data-sec=allenamento]{--accent:#ff3030;--accent-soft:#401010}
 body[data-sec=andamento]{--accent:#8fa8c2;--accent-soft:#222c36}
 body[data-sec=profilo]{--accent:#f5953a;--accent-soft:#3a2510}
}
.brand span{color:var(--brand)}
nav.tabs button[data-tab=diario].on{color:#12808c}
nav.tabs button[data-tab=dieta].on{color:#56731a}
nav.tabs button[data-tab=allenamento].on{color:#e11d1d}
nav.tabs button[data-tab=andamento].on{color:#4a6178}
nav.tabs button.center svg{background:var(--brand)!important;color:var(--accent-ink)!important}
body[data-sec=allenamento] .note:not(.warn){background:var(--surface2)}
.psvg{display:block}
nav.tabs button.center:not(.on){color:var(--muted)}
nav.tabs button.center.on{color:var(--brand)}
@media (prefers-color-scheme:dark){
 nav.tabs button[data-tab=diario].on{color:#35b3be} nav.tabs button[data-tab=dieta].on{color:#9cc04a}
 nav.tabs button[data-tab=allenamento].on{color:#ff5a4f} nav.tabs button[data-tab=andamento].on{color:#8fa8c2}
}

/* ===================== RESTYLING GRAFICO (nov 2026) =====================
   Ogni sezione tiene il suo colore (vedi "colori per sezione" sopra), superfici più morbide,
   aree di tocco ≥ 44 px, campi a 16 px (evita lo zoom automatico su iPhone),
   intestazione fissa e barra di navigazione con indicatore. Togliere questo blocco = grafica precedente. */
:root{--bg:#f3f5f2;--surface2:#eef2ed;--line:#e3e8e2;--radius:20px;--brand:#1a7a50;
  --shadow:0 1px 2px rgba(20,40,28,.04),0 6px 20px rgba(20,40,28,.06)}
@media (prefers-color-scheme:dark){
  :root{--bg:#0d1210;--surface:#161d19;--surface2:#1e2722;--line:#26312b;--brand:#3cb87f;--shadow:none}
}
html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
.app{padding:0 16px calc(112px + env(safe-area-inset-bottom))}
/* intestazione fissa e traslucida */
header.top{position:sticky;top:0;z-index:30;margin:0 -16px 12px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px)}
.brand{font-size:23px}
#langBtn{min-height:44px;padding:6px 12px}
.hdprof{width:44px;height:44px}
.sync .dot{width:7px;height:7px}
/* schede */
.card{border:0;box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
@media (prefers-color-scheme:dark){.card{border:1px solid var(--line)}}
h2{font-size:19px;font-weight:800;letter-spacing:-.02em}
h3{font-weight:800}
/* pulsanti e controlli: più grandi per il dito, con risposta al tocco */
.btn{min-height:46px;border-radius:14px;padding:12px 18px;transition:transform .12s ease,filter .12s ease}
.btn.sm{min-height:44px;border-radius:12px;padding:8px 13px}
.btn.ghost{min-height:44px}
.btn:active,.chip:active,.seg button:active,nav.tabs button:active,.icon-btn:active{transform:scale(.97)}
.btn:not(.sec):not(.ghost):not(.danger){box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 28%,transparent)}
.seg{border-radius:14px;padding:4px}
.seg button{min-height:44px;border-radius:11px;padding-left:6px;padding-right:6px}
.chip{min-height:44px;padding:8px 14px;display:inline-flex;align-items:center;gap:4px;background:var(--surface);transition:background .15s,color .15s}
.icon-btn{width:44px;height:44px;border-radius:12px;border:0;background:var(--surface);box-shadow:var(--shadow)}
.x{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center}
/* schermi stretti (iPhone SE, 320 px): le tre statistiche del fabbisogno restano dentro la scheda */
@media (max-width:360px){.grid3 .stat{padding:10px 8px}.grid3 .stat .v{font-size:18px}.stat .l{overflow-wrap:anywhere;hyphens:auto}}
input[type=number],input[type=text],input[type=date],select{font-size:16px;min-height:46px;border-radius:13px;border-color:transparent;background:var(--surface2)}
input:focus,select:focus{border-color:var(--accent);background:var(--surface)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stat{border-radius:14px;padding:12px 14px}
.bar{height:9px;border-radius:9px}.bar>i{border-radius:9px;transition:width .4s ease}
.note{border-radius:14px;padding:12px 14px}
/* menu a pillole che scorre in orizzontale (Allenamento, giorni del piano) */
.daytabs{margin:0 -16px 12px;padding:2px 16px 6px;scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding-inline:16px;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 28px),transparent)}
.daytabs::-webkit-scrollbar{display:none}
.daytabs button{scroll-snap-align:start}
/* barra di navigazione in basso */
nav.tabs{background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);border-top:1px solid var(--line)}
nav.tabs button{padding:8px 1px 10px;font-size:11px;min-height:58px;transition:color .15s}
nav.tabs button:not(.center) svg{padding:4px 16px;box-sizing:content-box;border-radius:999px;transition:background .2s}
nav.tabs button.on:not(.center) svg{background:color-mix(in srgb,currentColor 15%,transparent)}
nav.tabs button.center svg{box-shadow:0 6px 18px color-mix(in srgb,var(--brand) 40%,transparent)}
/* finestre a comparsa dal basso, con maniglia */
.modal-bg{background:rgba(8,14,10,.45);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.modal{border-radius:24px 24px 0 0;padding-top:24px;position:relative}
.modal:before{content:'';position:absolute;top:9px;left:50%;width:38px;height:5px;margin-left:-19px;border-radius:5px;background:var(--line)}
@media (min-width:640px){.modal{border-radius:24px}.modal:before{display:none}}
.toast{border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px);text-align:center}
/* timer di recupero: barra fissa sopra la navigazione, sempre visibile durante la seduta */
.restbar{position:fixed;left:0;right:0;z-index:25;display:flex;justify-content:center;padding:0 12px 8px;pointer-events:none}
.restbar .in{pointer-events:auto;display:flex;align-items:center;gap:8px;width:100%;max-width:560px;background:var(--ink);color:var(--bg);border-radius:16px;padding:8px 10px 8px 16px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.restbar .rt{flex:1;font-weight:800;font-size:17px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.restbar .rt small{display:block;font-size:12px;font-weight:600;opacity:.75}
.restbar button{border:0;background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);font:inherit;font-weight:800;min-height:44px;min-width:44px;padding:8px 12px;border-radius:12px;cursor:pointer;white-space:nowrap}
.restbar.done .in{background:var(--accent);color:var(--accent-ink)}.restbar.done button{color:var(--accent-ink);background:color-mix(in srgb,var(--accent-ink) 14%,transparent)}
body.resting .app{padding-bottom:calc(176px + env(safe-area-inset-bottom))}
/* miniature degli allungamenti create solo quando entrano nello schermo */
.pthumb{width:64px;height:53px;flex:none;cursor:pointer;background:var(--surface2);border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.pthumb:empty:before{content:'';width:22px;height:22px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--muted);opacity:.7}
.pthumb .psvg{width:64px!important;height:auto}
.sugg{border-radius:14px}.sugg div{min-height:44px;align-items:center}
.shop-item,.prow{min-height:48px}
.empty{padding:30px 12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===================== SCHERMATA DIETA ===================== */
.pbtn,.ptext,.pundo .btn{min-height:44px}
.pbtn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none!important}
.pdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin:0 -8px 12px}
.pday{height:44px;min-width:0;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:12px;font-weight:700;cursor:pointer;position:relative}
.pday.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pday.today:after{content:'';position:absolute;left:50%;bottom:6px;width:14px;height:3px;margin-left:-7px;border-radius:3px;background:currentColor}
.pday i{position:absolute;top:0;right:3px;font-style:normal;font-weight:800}
.ptot{background:var(--surface2);border-radius:14px;padding:12px}
.ptot .pk{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.ptot .pk b{font-size:30px;font-weight:800;letter-spacing:-.03em}
.ptot .bar{background:var(--line);margin:5px 0 0;overflow:hidden}.ptot .bar>i{display:block;height:100%}
.pmacs{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:8px;margin-top:12px}
.pmac{min-width:0;display:flex;flex-direction:column;font-size:12px;overflow-wrap:anywhere}
.pmac b{font-size:17px}.pmac.main b{font-size:21px;color:var(--p)}
.pflag{font-size:12px;font-weight:800;color:var(--ink)}
.pflag.warn{color:var(--warn)}
.pmeal{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.pkick{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 8px;font-size:13px;color:var(--muted);font-weight:600}
.ptitle{margin:4px 0 6px;font-size:19px;line-height:1.25;font-weight:800;letter-spacing:-.01em;color:var(--accent);overflow-wrap:anywhere}
.pmeal .pitem .n{min-width:0;overflow-wrap:anywhere}
.pswap{width:44px;height:44px;flex:0 0 44px;font-size:17px;padding:0;border-radius:12px}
.pmeal details summary,.pgen summary{min-height:44px;display:list-item;padding:12px 0}
.pactions{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.pwarn{margin:0 0 6px;display:flex;gap:8px}
.pundo{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.pintol .cb{min-height:44px}
.modal-bg.swallow{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}.modal-bg.swallow .modal{visibility:hidden}
.syswarn .note{margin-bottom:12px;border:1px solid var(--warn)}

const WARNS={};
function sysWarn(key,text,actions){WARNS[key]={text,actions:actions||[]};drawWarns();}
function clearWarn(key){if(!WARNS[key])return;delete WARNS[key];drawWarns();}
function drawWarns(){
  const el=document.getElementById('sysWarn'); if(!el)return;
  const ks=Object.keys(WARNS); el.classList.toggle('hidden',!ks.length);
  el.innerHTML=ks.map(k=>`<div class="note warn" role="alert"><div>${esc(WARNS[k].text)}</div>${WARNS[k].actions.length?`<div class="row wrap" style="gap:6px;margin-top:8px">${WARNS[k].actions.map((a,i)=>`<button class="btn sm ${i?'sec':''}" data-warn="${k}" data-wi="${i}">${esc(a.l)}</button>`).join('')}</div>`:''}</div>`).join('');
  el.querySelectorAll('[data-warn]').forEach(b=>b.onclick=()=>{const w=WARNS[b.dataset.warn];if(w&&w.actions[+b.dataset.wi])w.actions[+b.dataset.wi].fn();});
}

// ---- localStorage ----
// Ritorna true se i dati sono davvero scritti. Se la memoria è piena NON riscrive mai una versione ridotta
// (prima le foto venivano cancellate): avvisa e lascia intatto quello che c'era.
function lsSave(){
  if(lsBlocked)return false;
  try{
    const out={v:S.v||DATA_V,main:S.main,diary:S.diary};
    if(!idbOK)out.photos=S.photos||{};
    localStorage.setItem(LS_KEY,JSON.stringify(out));
    clearWarn('quota'); return true;
  }catch(e){
    sysWarn('quota','Memoria piena: l\'ultima modifica non è stata salvata. Esporta i dati o elimina qualche foto.',[{l:'Vai a backup e dati',fn:goBackup}]);
    return false;
  }
}
function lsLoad(){
  let raw=null; try{raw=localStorage.getItem(LS_KEY);}catch(e){return null;}
  if(raw==null)return null;
  try{const v=JSON.parse(raw);if(v&&v.main&&typeof v.main==='object')return migrate(v);}catch(e){}
  // dati illeggibili: copia di recupero (una già presente non viene mai sovrascritta) e avviso; nulla parte "da vuoto" in silenzio
  recoveryRaw=raw; let safe=false;
  try{const old=localStorage.getItem(LS_RECOVERY);if(old==null){localStorage.setItem(LS_RECOVERY,raw);safe=true;}else safe=(old===raw);}catch(e){}
  if(!safe)lsBlocked=true; // non si riesce a metterli al sicuro: non si sovrascrive nulla finché l'utente non decide
  sysWarn('recovery','I dati salvati non si leggono più. Non sono stati cancellati: puoi provare a ripristinarli o copiarli per conservarli.',[
    {l:'Prova a ripristinare',fn:tryRecovery},{l:'Copia i dati',fn:copyRecovery},{l:'Scarta e ricomincia',fn:discardRecovery}]);
  return null;
}
function recoveryText(){let t=null;try{t=localStorage.getItem(LS_RECOVERY);}catch(e){}return t!=null?t:recoveryRaw;}
function tryRecovery(){
  const t=recoveryText(); let d=null;
  try{d=JSON.parse(t);}catch(e){}
  if(!d||!d.main||typeof d.main!=='object'){toast('Impossibile leggere la copia: usa «Copia i dati» per conservarla');return;}
  S={v:d.v,main:Object.assign(DEFAULT_MAIN(),d.main),diary:d.diary||{},photos:S.photos&&Object.keys(S.photos).length?S.photos:(d.photos||{})}; migrate(S); restoreSession();
  lsBlocked=false; if(lsSave()){try{localStorage.removeItem(LS_RECOVERY);}catch(e){}clearWarn('recovery');toast('Dati ripristinati');draft=null;render();}
}
async function copyRecovery(){
  const t=recoveryText()||''; try{await navigator.clipboard.writeText(t);toast('Dati copiati: incollali in un messaggio o in una nota per conservarli');}
  catch(e){$('#modal').innerHTML=`<h2 style="margin-top:0">Dati da conservare</h2><p class="small muted">Seleziona tutto il testo e copialo in una nota.</p><textarea rows="6" style="width:100%" readonly></textarea><button class="btn sec sm" id="mClose" style="margin-top:8px">Chiudi</button>`;$('#modal textarea').value=t;$('#mClose').onclick=hideModal;showModal();$('#modal textarea').select();}
}
function discardRecovery(){
  confirmPanel('Scartare i dati illeggibili?','La copia di recupero viene eliminata e l\'app ricomincia da zero. Se vuoi conservarla, prima usa «Copia i dati».','Scarta',()=>{
    try{localStorage.removeItem(LS_RECOVERY);}catch(e){} recoveryRaw=null; lsBlocked=false; clearWarn('recovery'); lsSave(); render();});
}

// ---- foto in IndexedDB (con migrazione automatica da localStorage e ritorno a localStorage se non disponibile) ----
const IDB_NAME='mezfit', IDB_STORE='photos';
function idbOpen(){return new Promise((res,rej)=>{try{if(!window.indexedDB)return rej(new Error('no idb'));const r=indexedDB.open(IDB_NAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(IDB_STORE))r.result.createObjectStore(IDB_STORE);};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'));}catch(e){rej(e);}});}
function idbRun(mode,fn){return idbOpen().then(d=>new Promise((res,rej)=>{try{const tx=d.transaction(IDB_STORE,mode);const q=fn(tx.objectStore(IDB_STORE));tx.oncomplete=()=>{d.close();res(q?q.result:undefined);};tx.onerror=()=>{d.close();rej(tx.error);};tx.onabort=()=>{d.close();rej(tx.error||new Error('abort'));};}catch(e){d.close();rej(e);}}));}
function idbAll(){return idbRun('readonly',st=>st.getAll()).then(arr=>{const o={};(arr||[]).forEach(p=>{if(p&&p.id)o[p.id]={d:p.d,img:p.img};});return o;});}
function idbPut(id,p){return idbRun('readwrite',st=>st.put({id,d:p.d,img:p.img},id));}

function withTimeout(p,ms){return new Promise((res,rej)=>{const t=setTimeout(()=>rej(new Error('timeout')),ms);p.then(v=>{clearTimeout(t);res(v);},e=>{clearTimeout(t);rej(e);});});}
async function initPhotos(local){

  try{
    stored=await withTimeout(idbAll(),3000);

// ---- cancellazione completa (localStorage, IndexedDB, cache del service worker, dati remoti) ----
async function wipeAll(){
  lsBlocked=true; Object.values(timers).forEach(clearTimeout);
  if(cloud){try{const snap=await db.collection('data/users/'+uid).get();await Promise.all(snap.docs.map(x=>db.collection('data/users/'+uid).doc(x.id).delete()));}catch(e){}}
  try{Object.keys(localStorage).filter(k=>k.startsWith('mezfit')).forEach(k=>localStorage.removeItem(k));}catch(e){}
  try{await withTimeout(new Promise(r=>{const q=indexedDB.deleteDatabase(IDB_NAME);q.onsuccess=q.onerror=q.onblocked=()=>r();}),3000);}catch(e){}
  try{if(window.caches){const ks=await caches.keys();await Promise.all(ks.filter(k=>k.startsWith('mezfit-')).map(k=>caches.delete(k)));}}catch(e){}
  try{if(navigator.serviceWorker){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()));}}catch(e){}
  location.reload();
}
async function flush(docKey){
  if(writing[docKey]){pending[docKey]=true;return;}
  writing[docKey]=true; setSync('busy','Salvataggio…');
  try{
    if(docKey.startsWith('photo-')&&!(S.photos||{})[docKey.slice(6)]){writing[docKey]=false;return;}
    const body = docKey==='main' ? S.main : docKey.startsWith('photo-') ? S.photos[docKey.slice(6)] : (S.diary[docKey.slice(6)]||{days:{}});
    await db.collection('data/users/'+uid).doc(docKey).set(JSON.parse(JSON.stringify(body)));
    setSync('ok','Salvato');
  }catch(e){
    if(e&&e.code==='unavailable'){setTimeout(()=>flush(docKey),1500+Math.random()*1000);}
    else{setSync('','Salvato solo su questo dispositivo');}
  }finally{
    writing[docKey]=false;
    if(pending[docKey]){pending[docKey]=false;flush(docKey);}
  }
}

async function init(){
  const local=lsLoad();
  if(local){S=local;S.main=Object.assign(DEFAULT_MAIN(),S.main);S.photos=S.photos||{};}
  await initPhotos(local);
  restoreSession();
  if(S.main&&S.main.lang&&LCAL[S.main.lang])LANG=S.main.lang;
  applyCalendar(); markLang();
  buildLangMenu();
  if(LANG!=='it'){trNode(document.body);document.title=tr('MezFit · Dieta e calorie');}
  trObserve();
  render();
  let timer=setTimeout(()=>{if(!cloud)setSync('','Salvato su questo dispositivo');},10000);
  try{
    if(!window.claude||!window.claude.use) throw 0;
    const [d,u]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!d||!u) throw 0;
    const id=await u.id(); if(!id) throw 0;
    db=d; uid=id;
    const snap=await db.collection('data/users/'+uid).get();
    clearTimeout(timer);
    cloud=true;
    if(snap.empty){
      // primo avvio nel cloud: carico eventuali dati locali
      if(local){flush('main');Object.keys(S.diary).forEach(m=>flush('diary-'+m));Object.keys(S.photos||{}).forEach(p=>flush('photo-'+p));}
    }else{
      const nd={};let nm=null;
      const np={};snap.docs.forEach(doc=>{const v=doc.data();if(doc.id==='main')nm=v;else if(doc.id.startsWith('diary-'))nd[doc.id.slice(6)]=JSON.parse(JSON.stringify(v));else if(doc.id.startsWith('photo-'))np[doc.id.slice(6)]=JSON.parse(JSON.stringify(v));});S.photos=np;
      if(nm) S.main=Object.assign(DEFAULT_MAIN(),JSON.parse(JSON.stringify(nm)));
      S.diary=nd; migrate(S); restoreSession(); lsSave();
      if(idbOK)Object.entries(S.photos).forEach(([id,p])=>idbPut(id,p).catch(()=>{}));
    }
    setSync('ok','Sincronizzato');
    if(S.main.lang&&LCAL[S.main.lang]&&S.main.lang!==LANG){const l=S.main.lang;LANG='it';setLang(l);}
    render();
  }catch(e){
    clearTimeout(timer);
    setSync('','Salvato su questo dispositivo');
  }
}

const LCAL={

const I18N_MISS=new Set();
const HASL=/[A-Za-zÀ-ÿ]/;
const TR_UNIT=/^[\s\d.,'’\u202f\u00a0%+\-–−×\/≈~()·:]*((kcal|kg|g|L|ml|cm|min|s|h|km|°C|RM|CHF)\b[\s\d.,'’\u202f\u00a0%+\-–−×\/≈~()·:]*)*$/;
function trCore(s){
  const d=window.I18N||{}, i=LI[LANG]; let v=d[s]; if(v&&v[i])return v[i];
  const nums=[]; const k=s.replace(/\d+(?:[.,'’\u202f\u00a0]\d+)*/g,m=>{nums.push(m);return '#';});
  if(nums.length){v=d[k]; if(v&&v[i]){let j=0;return v[i].replace(/#/g,()=>nums[j++]??'#');}}
  const um=s.match(/^([\d.,]+)\s+([A-Za-zÀ-ÿ][\s\S]*)$/); if(um){const r=trCore(um[2]); if(r!=null)return um[1]+' '+r;}
  const pm=s.match(/^([^A-Za-zÀ-ÿ0-9(«"]+)([\s\S]+)$/); if(pm){const r=trCore(pm[2]); if(r!=null)return pm[1]+r;}
  const em=s.match(/^([\s\S]*?[A-Za-zÀ-ÿ)»"])([^A-Za-zÀ-ÿ0-9)»"]+)$/); if(em){const r=trCore(em[1]); if(r!=null)return r+em[2];}
  return null;
}
const TSEP=[' · ',' — ',' – ',' → ',': ',' / ',', ',' + ',' (',' e '];
function trSplit(c,depth){
  if(depth>3)return null;
  for(const sep of TSEP){ if(!c.includes(sep))continue;
    const ps=c.split(sep); let ch=false;
    const t=ps.map((p,ix)=>{ if(sep===' ('&&ix>0){const q=p.replace(/\)$/,'');const r=trAny(q,depth+1);if(r!==q){ch=true;return r+(p.endsWith(')')?')':'');}return p;} const r=trAny(p,depth+1); if(r!==p)ch=true; return r;});
    if(ch)return t.join(sep);
  }
  return null;
}
function trAny(p,depth){
  const m=p.match(/^(\s*)([\s\S]*?)(\s*)$/), c=m[2]; if(!c||!HASL.test(c))return p;
  let r=trCore(c); if(r==null)r=trSplit(c,depth||0); return r==null?p:m[1]+r+m[3];
}
function tr(s){
  if(LANG==='it'||!s||!HASL.test(s))return s;
  const r=trAny(s,0); if(r===s){const c=s.trim(); if(c.length<160&&!TR_UNIT.test(c))I18N_MISS.add(c);} return r;
}

const TR_O=new WeakMap(), TR_A=new WeakMap(), TR_ATTRS=['placeholder','title','aria-label','alt'];
const TR_SKIP={SCRIPT:1,STYLE:1,TEXTAREA:1,CODE:1};
function trAttrs(el){
  if(!el.getAttribute)return; let m=TR_A.get(el); if(!m){m={};TR_A.set(el,m);}
  for(const a of TR_ATTRS){ const cur=el.getAttribute(a); if(cur==null)continue; let o=m[a]; const orig=(o&&cur===o.t)?o.o:cur; const out=tr(orig); m[a]={o:orig,t:out}; if(cur!==out)el.setAttribute(a,out);}
  if(el.tagName==='INPUT'&&(el.type==='button'||el.type==='submit')){const cur=el.value;let o=m.value;const orig=(o&&cur===o.t)?o.o:cur;const out=tr(orig);m.value={o:orig,t:out};if(cur!==out)el.value=out;}
}
function trNode(n){
  if(n.nodeType===3){
    const p=n.parentNode; if(!p||TR_SKIP[p.nodeName]||(p.closest&&p.closest('.notr,[contenteditable="true"]')))return;
    const o=TR_O.get(n); const orig=(o&&n.data===o.t)?o.o:n.data; const out=tr(orig); TR_O.set(n,{o:orig,t:out}); if(n.data!==out)n.data=out;
  } else if(n.nodeType===1){
    if(n.classList&&n.classList.contains('notr'))return;
    trAttrs(n); if(TR_SKIP[n.nodeName])return; for(const c of n.childNodes)trNode(c);
  }
}

/* ===================== CALCOLI FABBISOGNO ===================== */
function calc(pr){
  if(!pr||!pr.age||!pr.weight||!pr.height) return null;
  const bmr = 10*pr.weight + 6.25*pr.height - 5*pr.age + (pr.sex==='M'?5:-161);
  const tdeeF = bmr*pr.act;
  // il mantenimento ricavato dai dati resta entro limiti plausibili (diario incompleto = stima troppo bassa)
  const tdee = pr.tdeeOverride?Math.max(.75*tdeeF,Math.min(1.4*tdeeF,pr.tdeeOverride)):tdeeF;
  let adj = pr.adj ?? GOALS[pr.goal].adj;
  const floor = pr.sex==='M'?1500:1200;
  const warnings=[];
  const hm=pr.height/100, bmi=pr.weight/(hm*hm);
  const cs=(typeof conds==='function'&&S&&S.main)?conds():[];
  // minorenni: nessun deficit automatico, l'app non propone diete dimagranti
  if(pr.age<18){if(adj<0){adj=0;warnings.push('Sotto i 18 anni l\'app non propone diete dimagranti: ho portato l\'obiettivo al mantenimento. Parla con il pediatra o un dietista.');}
    else warnings.push('Sotto i 18 anni queste stime non sono affidabili: un\'eventuale dieta va seguita dal pediatra o da un dietista.');}
  if(cs.includes('gravidanza')){if(adj<0){adj=0;warnings.push('In gravidanza non si segue una dieta dimagrante: ho portato l\'obiettivo al mantenimento. Fatti seguire dal ginecologo o da un dietista.');}
    warnings.push('In gravidanza non aggiungo calorie extra in automatico: quante servono lo decide il ginecologo o un dietista. Dal piano tolgo carni e pesci crudi o affumicati, salumi crudi, formaggi a rischio e alcolici.');}
  if(cs.includes('allattamento')){if(adj<0){adj=0;warnings.push('Durante l\'allattamento non si segue una dieta dimagrante: ho portato l\'obiettivo al mantenimento. Fatti seguire dal ginecologo o da un dietista.');}
    warnings.push('Durante l\'allattamento non aggiungo calorie extra in automatico: quante servono lo decide il ginecologo o un dietista. Dal piano tolgo gli alcolici.');}
  if(bmi<18.5&&adj<0){adj=0;warnings.push('Il tuo peso è già sotto la norma (BMI inferiore a 18,5): ho azzerato il deficit. Parlane con il medico.');}
  if(cs.includes('diabete')) warnings.push('Con il diabete la quantità e la distribuzione dei carboidrati vanno concordate con il medico, soprattutto se usi insulina o farmaci.');
  let target = tdee + adj;
  if(target<floor){
    if(tdee<floor){
      // il fabbisogno stesso è sotto la soglia: niente deficit e lo dico onestamente (l'obiettivo mostrato resta il fabbisogno)
      if(adj<0){adj=0;target=tdee;}
      warnings.push(`Il fabbisogno stimato (${Math.round(tdee)} kcal) è sotto la soglia di sicurezza di ${floor} kcal: l'app non propone un piano in deficit. Consulta un medico o un dietista prima di cambiare alimentazione.`);
    } else {target=floor;adj=target-tdee;warnings.push(`Ho alzato l'obiettivo a ${Math.round(target)} kcal: sotto questa soglia serve la supervisione di un medico o di un dietista.`);}
  }
  if(target<bmr && target>=floor) warnings.push('L\'obiettivo è sotto il metabolismo basale: sostenibile solo per periodi brevi.');
  if(adj<0 && -adj/tdee>0.25) warnings.push('Un deficit oltre il 25% del fabbisogno rende più difficile mantenere la massa muscolare.');
  const pk = pr.pk ?? GOALS[pr.goal].pk;
  const fatPct = pr.fatPct ?? GOALS[pr.goal].fat;
  // con molto peso in eccesso le proteine si calcolano su un peso di riferimento, non su quello reale
  const w25=25*hm*hm, wRef=bmi>30?w25+.25*(pr.weight-w25):pr.weight;
  let P = pk*wRef;
  let F = Math.max(target*fatPct/100/9, 0.6*wRef);
  let C = (target - P*4 - F*9)/4;
  if(C<50){warnings.push('Con questi parametri i carboidrati restano molto bassi: valuta di ridurre proteine o grassi.');C=Math.max(C,0);}
  const kgWeek = adj*7/7700;
  return {bmr,tdee,tdeeF,adaptive:!!pr.tdeeOverride,adj,target,P,C,F,kgWeek,warnings,pk,fatPct,bmi,wRef,floor};
}

window.addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(['oggi','profilo','diario','andamento','dieta','allenamento'].includes(t)&&t!==tab)goTab(t,false);});

function render(){
  document.body.classList.toggle('wiz',!S.main.profile&&!(wiz&&wiz.skip));
  if(!S.main.profile&&!(wiz&&wiz.skip)){$('#view').innerHTML=viewWizard();bindWizard();return;}
  const t = tab || (S.main.profile?'oggi':'profilo');
  document.body.dataset.sec=t;
  document.querySelectorAll('nav.tabs button, #hdProf').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  const v=$('#view');
  if(t==='oggi') v.innerHTML=viewToday();
  if(t==='profilo') v.innerHTML=viewProfile();
  if(t==='diario') v.innerHTML=viewDiary();
  if(t==='andamento') v.innerHTML=viewTrend();
  if(t==='dieta') v.innerHTML=viewDiet();
  if(t==='allenamento') v.innerHTML=viewTrain();
  bind(t);
  if(session&&session.restEnd){ // recupero in corso (anche dopo una ricarica); se è scaduto da tempo si azzera in silenzio
    if(session.restEnd>Date.now()){if($('#restBar').classList.contains('hidden'))restShow();}
    else if(restT==null){session.restEnd=null;S.main.activeSession=session;save('main');}}
}

function bindWizard(){
  const rr=()=>render(), p=wiz.p;
  const rd=()=>{const v=(id,k,f)=>{const e=$(id);if(e){const x=numVal(e.value);p[k]=isNaN(x)?NaN:(f?f(x):x);}};v('#wAge','age');v('#wW','weight');v('#wH','height');if($('#wAct'))p.act=parseFloat($('#wAct').value);};
  document.querySelectorAll('[data-wg]').forEach(b=>b.onclick=()=>{const g=GOALS[b.dataset.wg];p.goal=b.dataset.wg;p.adj=g.adj;p.pk=g.pk;p.fatPct=g.fat;rr();});
  document.querySelectorAll('#wSex button').forEach(b=>b.onclick=e=>{e.preventDefault();rd();p.sex=b.dataset.v;rr();});
  document.querySelectorAll('[data-wp]').forEach(b=>b.onclick=()=>{wiz.place=b.dataset.wp;rr();});
  if($('#wBack'))$('#wBack').onclick=()=>{rd();wiz.step--;rr();};
  $('#wSkip').onclick=()=>{rd();draft=Object.assign({},p);wiz.skip=true;tab='profilo';rr();};
  $('#wNext').onclick=()=>{rd();
    if(wiz.step===1){const err=profileErr(p);if(err){toast(err);return;}}
    if(wiz.step<2){wiz.step++;rr();window.scrollTo(0,0);return;}
    const c=calc(p); if(p.goal==='dimagrire'&&c){p.adj=-Math.round(c.tdee*0.2/50)*50;}
    S.main.profile=Object.assign({},p); S.main.adv=false; S.main.wizPlace=wiz.place;
    if(wiz.place==='casa'&&!(S.main.homeEq||[]).length)S.main.homeEq=['manubri','elastici','tappetino'];
    save('main'); wiz=null; tab='oggi'; toast('Profilo salvato'); render(); window.scrollTo(0,0);};
}

let draft=null;
// limiti plausibili dei dati del profilo: fuori da questi l'app rifiuta il valore (numeri non finiti compresi)
const PLIM={age:[10,110],weight:[25,300],height:[100,250]};
function profileErr(p){
  const ok=(k)=>Number.isFinite(p[k])&&p[k]>=PLIM[k][0]&&p[k]<=PLIM[k][1];
  if(!ok('age'))return `Età non valida: inserisci un valore tra ${PLIM.age[0]} e ${PLIM.age[1]} anni`;
  if(!ok('weight'))return `Peso non valido: inserisci un valore tra ${PLIM.weight[0]} e ${PLIM.weight[1]} kg`;
  if(!ok('height'))return `Altezza non valida: inserisci un valore tra ${PLIM.height[0]} e ${PLIM.height[1]} cm`;
  return null;
}
// numero da un campo di testo: accetta anche la virgola decimale
function numVal(v){const x=parseFloat(String(v??'').trim().replace(',','.'));return Number.isFinite(x)?x:NaN;}
// ---- modifiche al profilo non salvate: prima di cambiare scheda si chiede se salvarle o annullarle ----
const PROF_KEYS=['sex','age','weight','height','act','goal','adj','pk','fatPct'];
function profileDirty(){const p=S.main.profile;if(!p||!draft)return false;return PROF_KEYS.some(k=>String(draft[k]??'')!==String(p[k]??''));}
function leaveProfile(next,go){
  if(tab!=='profilo'||next==='profilo'||!profileDirty()){go();return;}
  $('#modal').innerHTML=`<h2 style="margin-top:0">Modifiche non salvate</h2><p>Hai cambiato il profilo senza salvare. Vuoi salvare le modifiche?</p>
    <div class="row wrap" style="gap:8px;justify-content:flex-end"><button class="btn sec pbtn" id="puNo">Annulla le modifiche</button><button class="btn pbtn" id="puYes">Salva</button></div>`;
  $('#puNo').onclick=()=>{draft=null;hideModal();go();};
  $('#puYes').onclick=()=>{const err=profileErr(draft);if(err){toast(err);return;}S.main.profile=Object.assign({},draft);save('main');hideModal();toast('Profilo salvato');go();};
  showModal(); // Esc o tocco fuori: si resta sul profilo con le modifiche ancora da salvare
}

function prevBackup(){try{const t=localStorage.getItem(LS_PREV);if(!t)return null;const d=JSON.parse(t);return {d,when:d.t?new Date(d.t).toLocaleString(LOCALE[LANG]):'—'};}catch(e){return null;}}
// Controllo della struttura di un backup: ritorna il nome del campo sbagliato oppure null se va bene.
function validateBackup(d){
  const obj=x=>x&&typeof x==='object'&&!Array.isArray(x), num=x=>typeof x==='number'&&Number.isFinite(x), str=x=>typeof x==='string';
  if(!obj(d)||!obj(d.main))return 'main';
  const m=d.main;
  if(m.profile!=null){const p=m.profile;if(!obj(p)||!['M','F'].includes(p.sex)||!num(p.age)||!num(p.weight)||!num(p.height)||!num(p.act)||!GOALS[p.goal])return 'profile';
    for(const k of ['adj','pk','fatPct','tdeeOverride'])if(p[k]!=null&&!num(p[k]))return 'profile.'+k;}
  for(const k of ['pantry','toBuy'])if(m[k]!=null&&!(Array.isArray(m[k])&&m[k].every(str)))return k;
  if(m.customFoods!=null&&!(Array.isArray(m.customFoods)&&m.customFoods.every(f=>obj(f)&&str(f.id)&&str(f.n)&&num(f.k)&&num(f.p)&&num(f.c)&&num(f.f))))return 'customFoods';
  if(m.weights!=null&&!(Array.isArray(m.weights)&&m.weights.every(w=>obj(w)&&str(w.d)&&num(w.kg))))return 'weights';
  if(m.measures!=null&&!(Array.isArray(m.measures)&&m.measures.every(x=>obj(x)&&str(x.d))))return 'measures';
  if(m.favMeals!=null&&!(Array.isArray(m.favMeals)&&m.favMeals.every(f=>obj(f)&&str(f.id)&&str(f.name)&&Array.isArray(f.items))))return 'favMeals';
  for(const k of ['replaced','shopChecks','genOpts','dietPrefs','exNotes'])if(m[k]!=null&&!obj(m[k]))return k;
  if(m.plan!=null&&!(obj(m.plan)&&Array.isArray(m.plan.days)))return 'plan';
  if(m.training!=null&&!(obj(m.training)&&Array.isArray(m.training.days)&&m.training.days.every(x=>obj(x)&&str(x.name)&&Array.isArray(x.ex))))return 'training';
  if(m.activeSession!=null&&!(obj(m.activeSession)&&Array.isArray(m.activeSession.ex)))return 'activeSession';
  if(d.diary!=null){if(!obj(d.diary))return 'diary';
    for(const [mk,mo] of Object.entries(d.diary)){if(!/^\d{4}-\d{2}$/.test(mk)||!obj(mo))return 'diary.'+mk;
      if(mo.days!=null){if(!obj(mo.days))return 'diary.'+mk+'.days';
        for(const [dk,arr] of Object.entries(mo.days)){if(!/^\d{4}-\d{2}-\d{2}$/.test(dk)||!Array.isArray(arr)||!arr.every(e=>obj(e)&&str(e.id)&&str(e.name)&&num(e.k)&&num(e.p)&&num(e.c)&&num(e.f)&&(e.foodId==null||str(e.foodId))&&(e.g==null||num(e.g))))return 'diary.'+dk;}}
      if(mo.workouts!=null&&!(obj(mo.workouts)&&Object.values(mo.workouts).every(a=>Array.isArray(a)&&a.every(w=>obj(w)&&str(w.id)))))return 'diary.'+mk+'.workouts';
      if(mo.extra!=null&&!obj(mo.extra))return 'diary.'+mk+'.extra';}}
  return null;
}
function parseBackup(t){
  let d=null; t=String(t||'').trim(); if(!t)return {err:'vuoto'};
  try{d=JSON.parse(decodeURIComponent(escape(atob(t.replace(/^MEZFIT1:/,'')))));}catch(e){try{d=JSON.parse(t);}catch(e2){return {err:'formato'};}}
  const err=validateBackup(d); return err?{err}:{d};
}
function diaryDays(di){return Object.values(di||{}).reduce((n,m)=>n+Object.keys((m&&m.days)||{}).length,0);}
function applyData(d){
  S={v:d.v,main:Object.assign(DEFAULT_MAIN(),d.main),diary:d.diary||{},photos:S.photos||{}}; migrate(S); restoreSession();
  const ok=lsSave(); if(cloud){flush('main');Object.keys(S.diary).forEach(m=>flush('diary-'+m));}
  draft=null; return ok;
}
function adjPresets(goal,c){
  const t=c?c.tdee:2200, pct=x=>Math.round(t*x/50)*50;
  if(goal==='dimagrire') return [{v:-pct(.10),l:'−10%'},{v:-pct(.15),l:'−15%'},{v:-pct(.20),l:'−20%'},{v:-pct(.25),l:'−25%'}];
  if(goal==='mantenere') return [{v:0,l:'Nessuna variazione'}];
  if(goal==='peso') return [{v:250,l:'+250'},{v:400,l:'+400'},{v:500,l:'+500'},{v:700,l:'+700'}];
  return [{v:200,l:'+200 (pulito)'},{v:300,l:'+300'},{v:400,l:'+400'},{v:500,l:'+500'}];
}

function monthKey(d){return d.slice(0,7);}
function dayEntries(d){const m=S.diary[monthKey(d)];return (m&&m.days&&m.days[d])||[];}
function setDayEntries(d,arr){const mk=monthKey(d);if(!S.diary[mk])S.diary[mk]={days:{}};if(!S.diary[mk].days)S.diary[mk].days={};if(arr.length)S.diary[mk].days[d]=arr;else delete S.diary[mk].days[d];save('diary-'+mk);}
function sumEntries(arr){return arr.reduce((a,e)=>({k:a.k+e.k,p:a.p+e.p,c:a.c+e.c,f:a.f+e.f}),{k:0,p:0,c:0,f:0});}

function needProfile(){return `<div class="card empty"><p>Imposta prima il tuo profilo per calcolare il fabbisogno.</p><button class="btn" onclick="tab='profilo';render()">Vai al profilo</button></div>`;}
function macroBar(label,val,tgt,color){
  const pct=tgt>0?Math.min(100,val/tgt*100):0, over=val>tgt*1.1;
  return `<div class="macro"><div class="t"><span>${label}</span><span>${r0(val)} / ${r0(tgt)} g${over?' <span style="color:var(--warn)">▲</span>':''}</span></div><div class="bar"><i style="width:${pct}%;background:${color}"></i></div></div>`;
}
function ring(val,tgt){
  const R=46,C=2*Math.PI*R, pct=tgt>0?Math.min(1,val/tgt):0, over=val>tgt*1.05;
  return `<svg width="118" height="118" viewBox="0 0 118 118" aria-hidden="true"><circle cx="59" cy="59" r="${R}" fill="none" stroke="var(--surface2)" stroke-width="11"/><circle cx="59" cy="59" r="${R}" fill="none" stroke="${over?'var(--warn)':'var(--accent)'}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${C*pct} ${C}" transform="rotate(-90 59 59)"/><text x="59" y="56" text-anchor="middle" font-size="22" font-weight="800" fill="var(--ink)">${fmt(val)}</text><text x="59" y="74" text-anchor="middle" font-size="11" fill="var(--muted)">di ${fmt(tgt)} kcal</text></svg>`;
}

    ${cycleOn()?`<div class="small muted" style="margin-top:8px">${T.train?'🏋️ Giorno di allenamento':'😴 Giorno di riposo'}: carboidrati ${T.delta>0?'+':''}${Math.round(T.delta/4)} g rispetto alla media.</div>`:''}

    ${DIARY_MEALS.map(([k,n])=>{

    }).join('')}
  </div>
  ${waterCard(d)}
  <div class="row wrap"><button class="btn sec sm" id="copyPrev">Copia il giorno precedente</button>${S.main.plan?`<button class="btn sec sm" id="fromPlan">Usa il piano dieta</button>`:''}</div>

let modalOpener=null;
function showModal(){
  const bg=$('#modalBg'); bg.classList.remove('swallow');
  if(!bg.classList.contains('on'))modalOpener=document.activeElement;
  bg.classList.add('on');
  requestAnimationFrame(()=>{const m=$('#modal'); if(!bg.classList.contains('on')||!m)return;
    const h=m.querySelector('h2'); if(h){if(!h.id)h.id='mTitle';m.setAttribute('aria-labelledby',h.id);} else m.removeAttribute('aria-labelledby');
    const a=document.activeElement; if(a&&a!==document.body&&m.contains(a))return; // un campo ha già il focus (es. ricerca alimento)
    const f=m.querySelector('#mClose')||m.querySelector('button,input:not([type=hidden]):not([type=file]),select,textarea'); if(f)f.focus({preventScroll:true});});
}
// alla chiusura si fermano le figure animate e si svuota il pannello: niente cicli di disegno a finestra chiusa
function stopViewers(root){if(!root)return;root.querySelectorAll('.v3').forEach(r=>{if(r._raf){cancelAnimationFrame(r._raf);r._raf=0;}if(r._tm){clearTimeout(r._tm);r._tm=0;}});}
function hideModal(){
  const bg=$('#modalBg'), was=bg.classList.contains('on'); bg.classList.remove('on'); const m=$('#modal'); stopViewers(m); m.innerHTML='';
  if(was&&modalOpener&&modalOpener.isConnected&&modalOpener!==document.body){try{modalOpener.focus({preventScroll:true});}catch(e){}}
  modalOpener=null;
}

function chart(data,target){
  const W=Math.max(300,Math.min(700,(document.querySelector('.app')||document.body).clientWidth-60)),H=200,pl=40,pr=8,pt=10,pb=26, n=data.length;
  const maxV=Math.max(target*1.25,...data.map(x=>x.k))*1.05;
  const y=v=>pt+(H-pt-pb)*(1-v/maxV);
  const bw=(W-pl-pr)/n, gap=Math.max(2,bw*0.28);
  const step=maxV>3500?1000:500;
  let g='';
  for(let v=0;v<=maxV;v+=step){g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v?fmt(v):'0'}</text>`;}
  const bars=data.map((x,i)=>{
    const X=pl+i*bw+gap/2, w=bw-gap, h=Math.max(0,y(0)-y(x.k));
    const col=Math.abs(x.k-target)<=target*0.1?'var(--brand)':x.k>target?'var(--warn)':'var(--p)'; // «in linea» = verde del marchio, distinto dal blu di «sotto»
    const dd=parseYmd(x.d); const lab=n<=7?DOW_S[i]:((dd.getDate()===1||dd.getDate()%5===0)?dd.getDate():'');
    const rr=Math.min(4,w/2);
    const path=h>0?`M${X},${y(0)} L${X},${y(x.k)+rr} Q${X},${y(x.k)} ${X+rr},${y(x.k)} L${X+w-rr},${y(x.k)} Q${X+w},${y(x.k)} ${X+w},${y(x.k)+rr} L${X+w},${y(0)} Z`:'';
    return `<g class="hb" data-tip="${esc(dayLabel(x.d))}: ${x.n?fmt(x.k)+' kcal ('+(x.k-target>0?'+':'')+fmt(x.k-target)+')':'nessun dato'}">${path?`<path d="${path}" fill="${col}"/>`:''}<rect x="${pl+i*bw}" y="${pt}" width="${bw}" height="${H-pt-pb}" fill="transparent"/><text x="${X+w/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="${x.d===today()?'var(--ink)':'var(--muted)'}" font-weight="${x.d===today()?700:400}">${lab}</text></g>`;
  }).join('');
  const tl=`<line x1="${pl}" x2="${W-pr}" y1="${y(target)}" y2="${y(target)}" stroke="var(--ink2)" stroke-width="2" stroke-dasharray="5 4"/>`;
  return `<div class="chart-wrap" id="cWrap"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Calorie giornaliere rispetto all'obiettivo">${g}${bars}${tl}</svg><div class="tip" id="tip"></div></div>`;
}

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
// alimenti da evitare in gravidanza (Linee guida ISS/Ministero della Salute): carni e pesci crudi o affumicati, salumi crudi,
// formaggi a latte crudo o erborinati, dolci con uova crude. Regole sul nome e sugli id: gli alimenti non vengono rinominati.
const PREG_IDS=new Set(['bresaola','bresaola_di_tacchino','prosciutto_crudo','prosciutto_crudo_sgrassa','prosciutto_crudo_di_parm','speck','speck_dell_alto_adige_sg','salame','salame_ungherese','salametto_salsiccia_secc','salame_di_cinghiale','carne_secca_dei_grigioni','mostbrockli','mostbrockli_appenzellese','beef_jerky_carne_essicca','prosciutto_di_cervo','salmone_affumicato','trota_affumicata','sgombro_affumicato','aringa_affumicata','coregone_affumicato','carpaccio_di_manzo','tartare_di_manzo','gorgonzola','brie_camembert','roquefort','taleggio','tiramisu','tiramisu_in_vaschetta']);
const PREG_MEAT_RX=/carpaccio|tartare|sashimi|sushi|nigiri|\bmaki\b|gunkan|uramaki|temaki|chirashi|poke|ceviche|kaisendon|sakedon|tekkadon|crud[oi] di |ostric|frutti di mare crud|affumicat[oa]|bresaola|prosciutto crudo|speck|salam[ei]|salsiccia secca|coppa|pancetta|lardo|carne secca|mostbr|jerky|nduja|chorizo|soppressata|culatello|lonzino/;
const PREG_DAIRY_RX=/gorgonzola|roquefort|\bbrie\b|camembert|taleggio|erborinat|latte crudo|stilton|bleu|blu\b/;
const PREG_EGG_RX=/tiramis|zabaione|uov[oa] crud|mousse|crema al mascarpone|maionese fatta in casa/;
const ALC_RX=/\bbirra\b|\bvino\b|prosecco|spumante|champagne|spritz|cocktail|liquore|grappa|whisk|vodka|\bgin\b|\brum\b|tequila|\bsake\b|umeshu|highball|margarita|mojito|negroni|aperol|campari|baileys|limoncello|\bamaro\b|sangria|sidro|cider|superalcolic|lambrusco|passito|porto\b|sherry|vermouth|shochu|soju|chuhai|caipirinha|pisco|mezcal|bourbon|cognac|brandy|absinthe|ouzo|raki|pastis|kirsch|calvados|schnaps|glühwein|vin brul/;
const NOALC_RX=/analcolic|senza alcol|0[.,]0|dealcol|lievito|aceto|brasato|risotto|al vino|alla birra|allo spumante|salsa|praline|torta|biscott|gelato|sorbetto|marinat|cotto nel|stufato|spezzatino|sugo/;
function pregRisk(f){
  const n=(f.n||'').toLowerCase(), t=f.tags||[];
  if(PREG_IDS.has(f.id))return true;
  if((t.includes('carne')||t.includes('pesce'))&&PREG_MEAT_RX.test(n)&&!/cott[oa]|tacchino affumicat|pollo affumicat|kassler|brisket|pastrami|wurstel|mortadella|prosciutto di praga|pizza|al forno|grigli|fritt/.test(n))return true;
  if(t.includes('latticini')&&PREG_DAIRY_RX.test(n))return true;
  if(t.includes('uova')&&PREG_EGG_RX.test(n))return true;
  return false;
}
function isAlcohol(f){const n=(f.n||'').toLowerCase();return ALC_RX.test(n)&&!NOALC_RX.test(n);}
// esclusioni legate alle condizioni di salute indicate (gravidanza, allattamento)
function healthBan(f){
  const cs=(typeof conds==='function')?conds():[];
  if(!cs.length)return false;
  if(cs.includes('gravidanza')&&(pregRisk(f)||isAlcohol(f)))return true;
  if(cs.includes('allattamento')&&isAlcohol(f))return true;
  return false;
}
function dietOk(f,style){

// scala delle porzioni in base al fabbisogno giornaliero (2000 kcal = porzioni standard)

// calendario dei secondi piatti della settimana (14 pasti principali = pranzo e cena x 7)

const P_FREQ={
  misto:{legumi:3,pesce:3,bianca:3,uova:2,formaggi:1,rossa:1,veg:1},
  vegetariana:{legumi:5,veg:4,uova:3,formaggi:2},
  vegana:{legumi:7,veg:7},
  carne:{bianca:10,rossa:4},
  pesce:{pesce:14}};
function proteinSchedule(style,n,R,pool){

  let bag=[]; Object.entries(fq).forEach(([g,k])=>{if(has(g))for(let i=0;i<k;i++)bag.push(g);});
  if(!bag.length) return [];

  Object.entries(fq).filter(([g])=>has(g)).forEach(([g,k])=>{const m=Math.round(k*scale);for(let i=0;i<m;i++)out.push(g);});

function mealCheck(items,style){
  const dp=S.main.dietPrefs, r={gluten:[],lactose:[],excluded:[],health:[],style:[],missing:0};
  items.forEach(it=>{const f=food(it.id); if(!f){r.missing++;return;}
    if(dietOk(f,style||'misto'))return;
    const t=f.tags||[]; let why=false;
    if(dp.noGluten&&t.includes('glutine')){r.gluten.push(f.n);why=true;}
    if(dp.noLactose&&t.includes('lattosio')){r.lactose.push(f.n);why=true;}
    if((dp.excluded||[]).includes(f.id)){r.excluded.push(f.n);why=true;}
    if(healthBan(f)){r.health.push(f.n);why=true;}
    if(!why)r.style.push(f.n);});
  // glutine, lattosio, alimenti esclusi (potrebbero essere allergie), alimenti a rischio in gravidanza/allattamento e alimenti mancanti bloccano il diario
  r.block=!!(r.gluten.length||r.lactose.length||r.excluded.length||r.health.length||r.missing);
  r.any=r.block||!!r.style.length;
  return r;
}

function shopList(p){
  const tot={};
  if(p) p.days.forEach(d=>d.meals.forEach(m=>m.items.forEach(it=>{tot[it.id]=(tot[it.id]||0)+it.g;})));
  (S.main.toBuy||[]).forEach(id=>{if(!(id in tot))tot[id]=0;});
  const have=new Set(S.main.pantry||[]);
  const by={}, inHouse=[];
  Object.entries(tot).forEach(([id,g])=>{const f=food(id);if(!f)return;
    if(have.has(id)&&!(S.main.toBuy||[]).includes(id)){inHouse.push({f,g});return;}
    (by[f.cat]=by[f.cat]||[]).push({f,g});});
  return {by,inHouse};
}

/* ===================== COMANDI VOCALI ===================== */
let dict=null, smp=null;
let voice={text:'',status:'',actions:null,reply:'',busy:false,listening:false};
async function initVoice(){
  try{
    if(!window.claude||!window.claude.use) return;
    const [d,sm]=await Promise.all([window.claude.use('dictation'),window.claude.use('sample')]);
    smp=sm||null;
    if(d){
      dict=d;
      d.onFinal(({text})=>{voice.text=(voice.text?voice.text:'')+(voice.text?text:text.trimStart());const i=$('#vIn');if(i)i.value=voice.text;});
      d.onPartial(({text})=>{const h=$('#vHint');if(h&&text)h.textContent='… '+text;});
      d.onState(({state,reason})=>{
        voice.listening=state!=='idle';
        const b=$('#micBtn');if(b)b.classList.toggle('rec',voice.listening);
        if(state==='listening'){const h=$('#vHint');if(h)h.textContent='Ti ascolto… tocca di nuovo il microfono quando hai finito.';}
        if(state==='idle'){
          if(reason==='not_granted'||reason==='unavailable'){dict=null;voice.status='Dettatura non disponibile qui: usa il microfono della tastiera.';rerenderDiary();return;}
          if((reason==='stopped'||reason==='viewer_stopped')&&voice.text.trim()) runVoice();
          else rerenderDiary();
        }
      });
    }
    if(tab==='diario'||(!tab&&S.main.profile)) rerenderDiary();
  }catch(e){}
}
function rerenderDiary(){const t=tab||(S.main.profile?'diario':'profilo');if(t==='diario'){const y=window.scrollY;render();window.scrollTo(0,y);}}
function bindVoice(){
  const inp=$('#vIn'); if(!inp) return;
  inp.oninput=e=>{voice.text=e.target.value;};
  inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();runVoice();}};
  $('#vGo').onclick=()=>runVoice();
  const mic=$('#micBtn');
  if(mic){mic.classList.toggle('rec',voice.listening);mic.onclick=()=>{
    if(!dict) return;
    if(dict.active()){dict.stop().catch(()=>{});return;}
    voice.text='';voice.actions=null;voice.status='';inp.value='';
    dict.start({language:LANG}).catch(err=>{
      if(err&&err.code==='unavailable'){dict.start().catch(()=>{});return;}
      if(err&&(err.code==='not_granted')){dict=null;voice.status='Permesso al microfono negato: puoi usare il microfono della tastiera.';rerenderDiary();}
      else if(err&&err.code==='rate_limited'){toast('Microfono occupato, riprova tra poco');}
    });
  };}
  document.querySelectorAll('[data-vok]').forEach(b=>b.onclick=()=>applyVoice());
  document.querySelectorAll('[data-vno]').forEach(b=>b.onclick=()=>{voice.actions=null;voice.status='Annullato.';rerenderDiary();});
}
function voicePreview(){

async function parseWithClaude(text){
  const ents=dayEntries(ui.date);
  const foods=allFoods().map(f=>`${f.id}|${f.n}|${f.k}|${f.p}|${f.c}|${f.f}${f.ug?'|1 '+f.ul+'='+f.ug+'g':''}`).join('\n');
  const prompt=`Sei il parser dei comandi di un diario alimentare. Il comando può essere in italiano, inglese, francese o tedesco. Trasforma il comando dell'utente in azioni sul diario del giorno ${ui.date}.

COMANDO: "${text}"

PASTI (chiavi): colazione, spuntino_m (spuntino di mattina), pranzo, spuntino (spuntino/merenda del pomeriggio), cena. Se il pasto non è detto usa "${defaultMeal()}" per le aggiunte.

${ents.length?ents.map(e=>`${e.id}|${e.meal}|${e.name}|${r0(e.g||0)}`).join('\n'):'(vuoto)'}

DATABASE ALIMENTI (id|nome|kcal|prot|carb|grassi per 100 g|unità):
${foods}

REGOLE
- "add": usa foodId del database se l'alimento corrisponde ragionevolmente; converti unità in grammi (es. "due uova" = 120). Se la quantità manca usa una porzione tipica.
- Se l'alimento NON è nel database, metti foodId null, un nome breve e stima kcal,p,c,f per la QUANTITÀ indicata (non per 100 g).
- "remove": per togliere voci esistenti, indica entryId preso dal diario attuale.
- "update": per cambiare la quantità di una voce esistente, entryId e nuovi grammi g.
- "reply": una frase breve in ${LNAME[LANG]} che riassume cosa farai, o che spiega cosa non hai capito.

{"actions":[{"type":"add","meal":"pranzo","foodId":"pollo","name":"Petto di pollo","g":150,"k":0,"p":0,"c":0,"f":0},{"type":"remove","entryId":"..."},{"type":"update","entryId":"...","g":200}],"reply":"..."}`;
  const out=await smp.json(prompt,{modelTier:'quick',cache:false});
  const acts=[];
  (out&&Array.isArray(out.actions)?out.actions:[]).forEach(a=>{
    if(!a||typeof a!=='object')return;
    if(a.type==='add'){
      const g=Number(a.g); if(!(g>0))return;

      const fid=a.foodId&&food(String(a.foodId))?String(a.foodId):null;
      if(!fid&&!a.name)return;
      acts.push(buildAdd(fid,String(a.name||''),g,meal,{k:Number(a.k)||0,p:Number(a.p)||0,c:Number(a.c)||0,f:Number(a.f)||0}));
    }else if(a.type==='remove'){
      const e=ents.find(x=>x.id===String(a.entryId)); if(e) acts.push({type:'remove',entryId:e.id,name:e.name,meal:e.meal,g:e.g});
    }else if(a.type==='update'){
      const e=ents.find(x=>x.id===String(a.entryId)); const g=Number(a.g);
      if(e&&g>0&&e.g>0) acts.push({type:'update',entryId:e.id,name:e.name,meal:e.meal,oldG:e.g,g});
    }
  });
  return {actions:acts,reply:out&&typeof out.reply==='string'?out.reply:''};
}
/* parser semplice di riserva, senza Claude */
const NUMW={un:1,uno:1,una:1,mezzo:.5,mezza:.5,due:2,tre:3,quattro:4,cinque:5,sei:6,sette:7,otto:8,nove:9,dieci:10};
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9.,' ]/g,' ');
const stem=w=>w.length>5?w.slice(0,w.length-2):w.length>3?w.slice(0,w.length-1):w;
function findMeal(t){if(/colazion/.test(t))return 'colazione';if(/pranz/.test(t))return 'pranzo';if(/cena/.test(t))return 'cena';if(/(spuntin|merend)/.test(t))return /mattin/.test(t)?'spuntino_m':'spuntino';return null;}
const STOPW=new Set(['aggiungi','aggiungere','metti','mettere','togli','rimuovi','elimina','cancella','leva','una','uno','due','tre','quattro','cinque','sei','sette','otto','nove','dieci','mezzo','mezza','con','del','della','dello','dei','delle','degli','alla','allo','alle','agli','nel','nella','per','dal','dalla','colazione','pranzo','cena','spuntino','merenda','mattina','pomeriggio','sera','grammi','grammo','gr','kg','chili','chilo','poi','anche','invece','pezzi','pezzo','fette','fetta','porzione','tazza','bicchiere','vasetto','oggi','ieri']);
function matchFood(t){
  const words=t.split(/\s+/).filter(w=>w.length>=3&&!STOPW.has(w)&&!/^\d/.test(w));
  if(!words.length) return null;
  const hit=(a,b)=>a===b||(a.length>=4&&b.length>=4&&(a.startsWith(stem(b))||b.startsWith(stem(a))));
  let best=null,bs=0;
  allFoods().forEach(f=>{
    const main=norm(f.n.split('(')[0]).split(/[\s\/]+/).filter(w=>w.length>=3&&!STOPW.has(w));
    const par=(f.n.match(/\(([^)]*)\)/)||['',''])[1]; const pw=norm(par).split(/\s+/).filter(w=>w.length>=3);
    let sc=0,matched=0,qhit=0; const usedW=new Set();
    words.forEach(x=>{let bw=0,bi=-1;main.forEach((w,k)=>{if(usedW.has(k))return;const v=(x===w||stem(x)===stem(w))?1.5:hit(x,w)?0.9:0;if(v>bw){bw=v;bi=k;}});if(bi>=0){usedW.add(bi);sc+=bw;matched++;qhit++;}});
    pw.forEach(w=>{if(words.some(x=>hit(x,w)))sc+=0.3;});
    if(!matched) return;
    sc-=0.4*(main.length-matched); sc+=1.5*qhit/words.length; if(COMMON.has(f.id))sc+=0.6; if(f.id.startsWith('c_'))sc+=1.5;
    if(sc>bs){bs=sc;best=f;}
  });
  return bs>=1.5?best:null;
}
function parseLocal(text){
  const t=norm(text); const acts=[]; const ents=dayEntries(ui.date);
  const globalMeal=findMeal(t);
  const parts=t.split(/,| poi | e poi |;| e (?=\d|un |una |uno |due |tre |quattro |cinque |mezz)/);
  parts.forEach(p=>{
    p=p.trim(); if(!p)return;
    const meal=findMeal(p)||globalMeal;
    const rem=/(togli|rimuov|elimin|cancell|leva)/.test(p);
    const f=matchFood(p);
    if(rem){
      const cands=ents.filter(e=>(!meal||e.meal===meal)&&(f?(e.foodId===f.id||norm(e.name).includes(norm(f.n).split(' ')[0])):p.split(/\s+/).some(w=>w.length>3&&norm(e.name).includes(stem(w)))));
      const e=cands[cands.length-1]; if(e&&!acts.some(a=>a.entryId===e.id)) acts.push({type:'remove',entryId:e.id,name:e.name,meal:e.meal,g:e.g});
      return;
    }
    if(!f)return;
    let g=null; const m=p.match(/(\d+(?:[.,]\d+)?)\s*(kg|chili|chilo|g|gr|grammi|grammo)?\b/);
    if(m){const n=parseFloat(m[1].replace(',','.'));const u=m[2]||'';if(/^(kg|chil)/.test(u))g=n*1000;else if(u)g=n;else g=f.ug&&n<=12?n*f.ug:n;}
    else{const w=p.split(/\s+/).find(x=>NUMW[x]!==undefined);if(w&&f.ug)g=NUMW[w]*f.ug;}
    if(!g)g=f.ug||100;
    acts.push(buildAdd(f.id,f.n,g,meal||defaultMeal()));
  });
  return {actions:acts,reply:acts.length?'':'Non ho trovato alimenti che conosco nel comando.'};
}

function searchFoods(q){
  const toks=norm(q).split(/\s+/).filter(Boolean);
  if(!toks.length) return [];
  const sc=f=>{const n=norm(LANG==='it'?f.n:trName(f.n)+' '+f.n);let s=0;for(const t of toks){if(!n.includes(t)&&!n.split(/\s+/).some(w=>w.startsWith(stem(t))))return -1;s+=n.startsWith(t)?3:(n.split(/\s+/).some(w=>w.startsWith(t))?2:1);}return s-n.length/100+(COMMON.has(f.id)?1.5:0)-(/\(/.test(f.n)?0.2:0);};
  return allFoods().map(f=>{const v=sc(f);return [f,v<0?v:v+(f.id.startsWith('c_')?4:0)];}).filter(x=>x[1]>=0).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
}

  tplFor(key).forEach(([role,drv])=>{const f=pick(role);if(f)items.push({id:f.id,role,drv,g:0});});
  rebalanceDrivers(items); solveMeal(items,tgt); return items;
}
function rolePool(role,source,style,eco,R){
  let l=candidates(role,source,style);
  if(eco&&l.length>3){
    const drv={pm:'p',sp:'p',pb:'p',cm:'c',cb:'c',fm:'f',fs:'f'}[role];
    const cost=f=>drv&&f[drv]>0?priceKg(f)/f[drv]:priceKg(f);
    l.sort((a,b)=>cost(a)-cost(b)); l=l.slice(0,Math.max(3,Math.ceil(l.length*0.35)));
  }
  const key=new Map(l.map(f=>[f.id,R()*(COMMON.has(f.id)||f.id.startsWith('c_')?1:2.5)]));
  l.sort((a,b)=>key.get(a.id)-key.get(b.id));
  return l;
}
function makeAlts(di,mi){
  const p=S.main.plan, meal=p.days[di].meals[mi]; const R=rng(Date.now()%1e9);
  const pools={}; ['pm','cm','pb','cb','sp','vg','fr','fm','fs'].forEach(r=>pools[r]=rolePool(r,p.source,p.style||'misto',p.eco,R));
  const cur=new Set(meal.items.map(i=>i.id)); const alts=[]; const seen=new Set([meal.items.map(i=>i.id).join()]);
  for(let k=0;k<12&&alts.length<3;k++){
    const items=buildMeal(meal.key,meal.pct,role=>{const l=pools[role];if(!l.length)return null;const pref=l.filter(f=>!cur.has(f.id));const src=pref.length?pref:l;return src[(k+Math.floor(R()*src.length))%src.length];},p.days[di].tk);
    const sig=items.map(i=>i.id).join(); if(seen.has(sig))continue; seen.add(sig); alts.push(items);
  }
  ui.alts={k:di+','+mi,list:alts};
}
async function aiRecipe(di,mi){

/* ===================== 1. PESO E FABBISOGNO ADATTIVO ===================== */
function weights(){return (S.main.weights||[]).slice().sort((a,b)=>a.d.localeCompare(b.d));}
function logWeight(d,kg){
  let w=(S.main.weights||[]).filter(x=>x.d!==d); w.push({d,kg}); w.sort((a,b)=>a.d.localeCompare(b.d)); S.main.weights=w;
  const last=w[w.length-1]; if(S.main.profile&&last) S.main.profile.weight=last.kg;
  save('main');
}
function linreg(pts){const n=pts.length;if(n<2)return null;let sx=0,sy=0,sxx=0,sxy=0;pts.forEach(([x,y])=>{sx+=x;sy+=y;sxx+=x*x;sxy+=x*y;});const den=n*sxx-sx*sx;if(!den)return null;const b=(n*sxy-sx*sy)/den;return {b,a:(sy-b*sx)/n};}
function adaptive(){
  const w=weights(); const end=today(); const start=addDays(end,-27);
  const ws=w.filter(x=>x.d>=start&&x.d<=end); if(ws.length<3) return {ok:false,why:`Servono almeno 3 pesate nelle ultime 4 settimane (ne hai ${ws.length}).`};
  const span=(parseYmd(ws[ws.length-1].d)-parseYmd(ws[0].d))/864e5; if(span<10) return {ok:false,why:'Le pesate devono coprire almeno 10 giorni.'};
  const t0=parseYmd(ws[0].d); const lr=linreg(ws.map(x=>[(parseYmd(x.d)-t0)/864e5,x.kg]));
  let intake=0,nd=0; for(let i=0;i<28;i++){const d=addDays(start,i);const e=dayEntries(d);if(e.length){intake+=sumEntries(e).k;nd++;}}
  if(nd<10) return {ok:false,why:`Servono almeno 10 giorni di diario nelle ultime 4 settimane (ne hai ${nd}).`};
  const avgIn=intake/nd, slope=lr.b; // kg/giorno
  const tdee=avgIn-slope*7700;
  return {ok:true,tdee,avgIn,kgWeek:slope*7,nd,nw:ws.length};
}
function weightChart(){
  const w=weights().slice(-60); if(w.length<2) return `<div class="small muted">Il grafico compare dalla seconda pesata.</div>`;
  const W=Math.max(300,Math.min(700,(document.querySelector('.app')||document.body).clientWidth-60)),H=170,pl=40,pr=10,pt=10,pb=24;
  const ys=w.map(x=>x.kg); let mn=Math.min(...ys),mx=Math.max(...ys); if(mx-mn<2){const m=(mx+mn)/2;mn=m-1;mx=m+1;} mn-=0.5;mx+=0.5;
  const t0=parseYmd(w[0].d), t1=parseYmd(w[w.length-1].d), span=Math.max(1,(t1-t0)/864e5);
  const X=d=>pl+(W-pl-pr)*((parseYmd(d)-t0)/864e5)/span, Y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  const step=(mx-mn)>8?2:(mx-mn)>4?1:0.5; let g='';
  for(let v=Math.ceil(mn/step)*step;v<=mx;v+=step){g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtN(r1(v))}</text>`;}
  const path=w.map((x,i)=>(i?'L':'M')+X(x.d).toFixed(1)+','+Y(x.kg).toFixed(1)).join(' ');
  const pts=w.map(x=>`<g class="wpt" data-tip="${esc(dayLabel(x.d))}: ${esc(fmtN(x.kg))} kg"><circle cx="${X(x.d)}" cy="${Y(x.kg)}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/><circle cx="${X(x.d)}" cy="${Y(x.kg)}" r="14" fill="transparent"/></g>`).join('');
  const fmtD=d=>{const x=parseYmd(d);return x.getDate()+' '+MONTHS[x.getMonth()].slice(0,3);};
  const lab=`<text x="${pl}" y="${H-6}" font-size="11" fill="var(--muted)">${fmtD(w[0].d)}</text><text x="${W-pr}" y="${H-6}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtD(w[w.length-1].d)}</text>`;
  return `<div class="chart-wrap" id="wWrap"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Andamento del peso">${g}<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/>${pts}${lab}</svg><div class="tip" id="wtip"></div></div>`;
}

  return Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([id,n])=>({f:food(id),n,g:lastG[id]}));
}

// ultimi alimenti registrati nel diario (distinti, dal più recente), con l'ultima quantità usata
function recentFoods(n){
  const seen=new Set(), out=[];
  for(const mk of Object.keys(S.diary).sort().reverse()){const days=(S.diary[mk]&&S.diary[mk].days)||{};

  return out;
}

const RK_CACHE={};
function rkOf(e){
  if(!e||!e.id)return [];
  if(RK_CACHE[e.id])return RK_CACHE[e.id];
  const n=String(e.n||'').toLowerCase(); const s=new Set();
  const apply=list=>list.forEach(t=>{if(t[0]==='-')s.delete(t.slice(1));else s.add(t);});
  RK_RULES.forEach(([re,tags])=>{if(re.test(n))apply(tags.split(' '));});
  if(e.eq==='bilanciere'&&/^squat|stacco|rematore|military|good morning|front squat|affondi con bilanciere|clean|snatch|jerk|push press|thruster|rack pull|scrollate|box squat|pause squat/.test(n))apply(['spineload']);
  if(EX_RK[e.id])apply(EX_RK[e.id]);
  return (RK_CACHE[e.id]=[...s]);
}

function scheme(goal,level,kind){

}

function exPool(m,kind,place){
  const st=typeof place==='string'?{place}:place;

  let l=EXDB.filter(e=>ms.includes(e.m)&&['w','b','t'].includes(e.ty)&&eqAllowed(e,st)&&!exRisk(e).length&&!disliked().includes(e.id));
  const lv=st.level||'intermedio', age=+(S.main.profile&&S.main.profile.age)||0;

  const sc=e=>(e.pop?0:2)+(e.k===kind?0:1)+(e.m===m?0:0.5)+(HARDRX.test(e.n)?(hard==='avanzato'?0:hard==='intermedio'?1:3):0)+(age>=65&&e.eq!=='macchina'?0.7:0);
